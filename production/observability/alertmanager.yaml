global:
  resolve_timeout: 5m

route:
  receiver: auris-generic-webhook
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: auris-generic-webhook
    webhook_configs:
      - url_file: /run/secrets/alertmanager_webhook_url
        send_resolved: true
        max_alerts: 100
        http_config:
          follow_redirects: false
          enable_http2: true
