global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    product: auris-flow
    deployment: single-host

rule_files:
  - /etc/prometheus/alerts.yaml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]

  - job_name: auris-flow-bff
    metrics_path: /metrics
    static_configs:
      - targets: [bff:8000]

  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8888, otel-collector:9464]

  - job_name: keycloak
    metrics_path: /metrics
    static_configs:
      - targets: [keycloak:9000]

  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]
