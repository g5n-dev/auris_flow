extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 384
    spike_limit_mib: 96
  attributes/redact:
    actions:
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: http.response.header.set-cookie
        action: delete
      - key: db.statement
        action: delete
      - key: http.target
        action: delete
      - key: url.path
        action: delete
      - key: url.query
        action: delete
      - key: client.address
        action: delete
      - key: client.port
        action: delete
      - key: network.peer.address
        action: delete
      - key: network.peer.port
        action: delete
      - key: net.peer.ip
        action: delete
      - key: net.peer.port
        action: delete
      - key: http.client_ip
        action: delete
      - key: http.user_agent
        action: delete
      - key: user_agent.original
        action: delete
      - key: enduser.id
        action: delete
      - key: user.id
        action: delete
  resource:
    attributes:
      - key: deployment.environment.name
        value: production
        action: upsert
  batch:
    send_batch_size: 1024
    timeout: 5s

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:9464
    resource_to_telemetry_conversion:
      enabled: true

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: warn
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, resource, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, resource, batch]
      exporters: [prometheus]
