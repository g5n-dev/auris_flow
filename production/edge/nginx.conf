map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

limit_req_zone $binary_remote_addr zone=auris_readiness:1m rate=5r/s;
proxy_cache_path /tmp/auris-readyz-cache keys_zone=auris_readyz:1m max_size=8m inactive=1m use_temp_path=off;

log_format auris_safe_json escape=json '{"timestamp":"$time_iso8601","method":"$request_method","path":"$uri","status":"$status","body_bytes_sent":"$body_bytes_sent","request_time":"$request_time","request_id":"$request_id"}';

server {
    listen 8080;
    server_name _;
    access_log /dev/stdout auris_safe_json;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location / {
        return 421;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    access_log /dev/stdout auris_safe_json;

    ssl_certificate /run/secrets/tls_cert;
    ssl_certificate_key /run/secrets/tls_key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:TLS:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    client_max_body_size 64m;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location = /metrics {
        return 404;
    }

    location = /readyz {
        limit_req zone=auris_readiness burst=10 nodelay;
        limit_req_status 429;
        proxy_cache auris_readyz;
        proxy_cache_key auris-readyz;
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 5s;
        proxy_cache_valid 503 1s;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 6s;
        proxy_cache_lock_age 6s;
        proxy_pass http://bff:8000/readyz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header traceparent "";
        proxy_set_header tracestate "";
        proxy_set_header baggage "";
        proxy_read_timeout 5s;
    }

    # The short-lived playback grant is carried in the query string so native
    # media elements can issue Range requests without custom headers. Never
    # write that credential to Nginx access logs; the BFF audit records only the
    # bounded grant nonce and resource identity.
    location = /api/v1/audio-playback {
        access_log off;
        proxy_pass http://bff:8000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header traceparent $http_traceparent;
        proxy_set_header tracestate "";
        proxy_set_header baggage "";
        proxy_read_timeout 60s;
    }

    location /api/ {
        proxy_pass http://bff:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header traceparent $http_traceparent;
        proxy_set_header tracestate "";
        proxy_set_header baggage "";
        proxy_read_timeout 60s;
    }

    location ~ ^/(realms|resources)/ {
        proxy_pass http://keycloak:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    location ~ /\. {
        deny all;
    }

    location /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}
