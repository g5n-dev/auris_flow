services:
  mysql:
    image: mysql:8.4
    container_name: auris-flow-mysql
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: auris_root
      MYSQL_DATABASE: auris_flow
      MYSQL_USER: auris
      MYSQL_PASSWORD: auris
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--log-bin-trust-function-creators=1"]
    volumes:
      - auris_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -hauris-flow-mysql -uauris -pauris --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    container_name: auris-flow-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - auris_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: auris-flow-minio
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - auris_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  minio-bootstrap:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set auris http://minio:9000 minioadmin minioadmin >/dev/null &&
        mc mb --ignore-existing auris/auris-flow-local >/dev/null &&
        mc anonymous set none auris/auris-flow-local >/dev/null &&
        mc version enable auris/auris-flow-local >/dev/null
    depends_on:
      minio:
        condition: service_healthy

  qdrant:
    image: qdrant/qdrant:v1.12.5
    container_name: auris-flow-qdrant
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - auris_qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-auris-qdrant-test-key}
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /healthz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'HTTP/1.1 200' <&3"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  auris_mysql_data:
  auris_redis_data:
  auris_minio_data:
  auris_qdrant_data:
