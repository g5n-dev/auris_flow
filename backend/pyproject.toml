[project]
name = "auris-flow-bff"
version = "1.0.0"
description = "FastAPI BFF for the Auris Flow prototype"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13.3",
  "authlib>=1.6.5,<1.8",
  "fastapi>=0.115.0",
  "httpx>=0.27.2",
  "opentelemetry-api>=1.31.0,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.31.0,<2",
  "opentelemetry-instrumentation-fastapi>=0.52b0,<1",
  "opentelemetry-instrumentation-httpx>=0.52b0,<1",
  "opentelemetry-instrumentation-redis>=0.52b0,<1",
  "opentelemetry-instrumentation-sqlalchemy>=0.52b0,<1",
  "opentelemetry-instrumentation-urllib>=0.52b0,<1",
  "opentelemetry-sdk>=1.31.0,<2",
  "pydantic>=2.9.2",
  "pydantic-settings>=2.5.2",
  "prometheus-client>=0.21.1,<1",
  "pymysql>=1.1.1",
  "python-dotenv>=1.0.1",
  "redis>=5.0.8",
  "sqlalchemy>=2.0.35",
  "uvicorn[standard]>=0.30.6",
]

[project.optional-dependencies]
dev = [
  "mypy>=2.3.0",
  "pip-audit>=2.10.1",
  "pytest>=8.3.3",
  "pytest-cov>=5.0.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.9",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=app --cov-report=term-missing --cov-fail-under=80"
