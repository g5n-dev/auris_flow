    CreateControlledExperimentRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - experiment_kind
        - task_type_id
        - hypothesis
        - allocation_unit
        - arms
        - primary_metric
        - min_sample_size_per_arm
      properties:
        experiment_id: {type: string, minLength: 2, maxLength: 128, nullable: true}
        name: {type: string, minLength: 2, maxLength: 255}
        experiment_kind:
          type: string
          enum: [task_version]
          description: 实验臂始终绑定不可变 TaskVersion；模型、Prompt、标签策略通过 variant_dimension 声明为版本包内唯一变量。
        variant_dimension:
          type: string
          enum: [workflow, model, prompt, label_policy, bundle]
          default: workflow
          description: 非 bundle 时，对照与候选只能在该维度存在实际执行差异；后端按规范化版本包指纹阻断空实验与混杂实验。
        task_type_id: {type: string, minLength: 2, maxLength: 128}
        hypothesis: {type: string, minLength: 10, maxLength: 2000}
        allocation_unit:
          type: string
          enum: [audio_session, conversation, store, user, device, business_object]
        arms:
          type: array
          minItems: 2
          maxItems: 2
          items: {$ref: "#/components/schemas/ExperimentArmRequest"}
          description: 必须精确包含 control 与 candidate，allocation_ppm 总和必须为 1000000。
        primary_metric:
          $ref: "#/components/schemas/ExperimentMetricRequest"
        guardrails:
          type: array
          maxItems: 16
          items: {$ref: "#/components/schemas/ExperimentGuardrailRequest"}
        min_sample_size_per_arm: {type: integer, minimum: 1, maximum: 10000000}
        confidence_level: {type: number, enum: [0.9, 0.95, 0.99], default: 0.95}
