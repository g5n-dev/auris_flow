      summary: 提交冻结版本的人工标签 draft
      description: >
        仅提交 draft 已冻结的 label_version_id、label_id、事件、证据和值。服务端锁定当前
        production ReleaseBundleHead；版本已切换时返回 STALE_LABEL_VERSION，禁止静默改标，
        必须先走显式 rebase。成功后追加 HumanReviewDecision 与双时态 LabelFact。
      operationId: postAudioSessionsByIdAnnotationsByAnnotationIdSubmissions
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XProjectId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/AnnotationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualLabelDraftSubmitRequest"
      responses:
        "201":
          description: 人工决定与权威 Fact 已追加，原 draft 转为 submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualLabelDraftSubmissionEnvelope"
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
        default:
          $ref: "#/components/responses/Error"

  /audio-sessions/{id}/annotations/{annotation_id}/rebases:
    post:
      tags: [audio-sessions]
      summary: 预览或确认人工标签 draft 的显式版本 rebase
      description: >
        preview 只返回当前 production Head 与已发布 Mapping Bundle 的版本/标签 diff；confirm
        必须回传精确 preview_sha256、全新 annotation_id 和二次确认词来创建新 draft。旧 draft 永不覆盖，
        结构性变化必须人工选择目标标签，value_type 改变时拒绝复制旧值。
      operationId: postAudioSessionsByIdAnnotationsByAnnotationIdRebases
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XProjectId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/AnnotationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualLabelDraftRebaseRequest"
      responses:
        "200":
          description: Mapping diff 与确认哈希预览；不改写业务对象
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualLabelDraftRebasePreviewEnvelope"
        "201":
          description: 已创建绑定当前 Head 的新 draft，旧 draft 保持不变
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualLabelDraftRebaseConfirmEnvelope"
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
        default:
          $ref: "#/components/responses/Error"

