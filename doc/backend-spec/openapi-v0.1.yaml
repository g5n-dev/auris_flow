      required: [taxonomy_mode, source_label_version_ids, target_label_version_id, mapping_bundle_id, fact_namespace, fact_set_id, fact_set_generation, fact_as_of, metric_definition_versions, timezone, period_boundary, denominator_definition]
      properties:
        taxonomy_mode:
          $ref: "#/components/schemas/LabelTaxonomyMode"
        source_label_version_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
        target_label_version_id:
          type: string
          maxLength: 128
          nullable: true
          description: normalized/recomputed 必填；native 为 null。
        mapping_bundle_id:
          type: string
          maxLength: 128
          nullable: true
          description: normalized 必填；native 为 null；recomputed 按 lineage 冻结。
        mapping_bundle_sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
          nullable: true
          readOnly: true
        fact_namespace:
          type: string
          minLength: 1
          maxLength: 128
        fact_set_id:
          type: string
          minLength: 1
          maxLength: 128
        fact_set_manifest_sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
          readOnly: true
        fact_set_generation:
          type: integer
          minimum: 1
        fact_as_of:
          type: string
          format: date-time
        metric_definition_versions:
          type: object
          minProperties: 1
          additionalProperties:
            type: string
        timezone:
          type: string
          minLength: 1
          maxLength: 64
          example: Asia/Shanghai
        period_boundary:
          type: string
          minLength: 1
          maxLength: 128
          example: "[start,end)"
        denominator_definition:
          type: string
          minLength: 1
          maxLength: 512
    CreateInsightMetricRunRequest:
      type: object
      additionalProperties: false
      description: >
        服务端指标目录决定标签版本适用性。目录声明 label_version_applicability=none
        时 label_scope 必须为 null/省略；任一标签派生指标要求完整 label_scope，缺失或
        mode 条件不满足时 fail closed，客户端不得自报 applicability。
      required: [metric_keys, time_range]
      properties:
        metric_keys:
          type: array
          minItems: 1
          maxItems: 20
          description: 受指标目录治理的指标 key；完成回执必须为每个 key 提供且仅提供一条结果。
          items:
            type: string
            minLength: 1
            maxLength: 128
        time_range:
          type: string
          minLength: 1
          maxLength: 512
        store_ids:
          type: array
          maxItems: 50
          default: []
          items:
            type: string
            minLength: 1
        model_version:
          type: string
          maxLength: 128
          nullable: true
        label_version:
          type: string
          maxLength: 128
          nullable: true
          deprecated: true
          description: 迁移期只读兼容字段；新运行使用 label_scope.source_label_version_ids。
        label_scope:
          $ref: "#/components/schemas/LabelMetricScope"
        source:
          type: string
          minLength: 1
          maxLength: 128
          default: ui
    InsightMetricScope:
      type: object
      additionalProperties: false
      required: [time_range, store_ids, model_version, label_version, label_version_applicability, label_scope]
      properties:
        time_range:
          type: string
        store_ids:
          type: array
          items:
            type: string
        model_version:
          type: string
          nullable: true
        label_version:
          type: string
          nullable: true
          deprecated: true
        label_version_applicability:
          $ref: "#/components/schemas/LabelVersionApplicability"
        label_scope:
          allOf:
            - $ref: "#/components/schemas/LabelMetricScope"
          nullable: true
    InsightMetricAggregationResult:
      type: object
      additionalProperties: false
      required: [metric_key, value, unit, sample_size, result_status, reason_codes]
      properties:
        metric_key:
          type: string
          minLength: 1
          maxLength: 128
        value:
          type: number
          nullable: true
        unit:
          type: string
          minLength: 1
          maxLength: 64
        sample_size:
          type: integer
          minimum: 0
        result_status:
          type: string
          enum: [value, not-applicable, zero-denominator, coverage-gap, recompute-required]
          default: value
        reason_codes:
          type: array
          uniqueItems: true
          description: 受 result_status 约束的稳定原因码；value 必须为空，N/A 必须非空。
          items:
            type: string
            enum: [LABEL_NOT_APPLICABLE, LABEL_DEPRECATED_NOT_APPLICABLE, ZERO_DENOMINATOR, COVERAGE_GAP, RECOMPUTE_REQUIRED, FACT_SET_EMPTY, SOURCE_DATA_MISSING, MAPPING_RECOMPUTE_REQUIRED]
    InsightMetricCompletion:
