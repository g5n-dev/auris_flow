    get:
      tags: [task-runs]
      summary: 任务运行详情
      description: >
        返回执行引擎中立的任务运行投影；所有嵌套自由 JSON 同样递归移除底层调度、
        引擎/适配器标识、远端运行 ID、签名和 secret 字段。
