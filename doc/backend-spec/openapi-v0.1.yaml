        创建执行引擎中立的领域运行。响应只包含 tenant/project、领域状态、状态历史、
        trace、结果引用与可执行下一步；底层调度、引擎绑定、远端运行 ID、适配器和签名证据
        仅保存在 scoped MySQL、Outbox、完成回执与审计记录中。
      operationId: postTaskRuns
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XProjectId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
