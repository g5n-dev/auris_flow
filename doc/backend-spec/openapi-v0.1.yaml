                    target_label_version_id: lv_19
                    mapping_bundle_id: lmb_to_lv_19_20250531
                    fact_set_generation: 42
                    fact_as_of: "2025-05-31T23:59:59Z"
                    metric_definition_versions:
                      reception_conversion_quality: "3"
                      quote_consistency: "2"
                    timezone: Asia/Shanghai
                    period_boundary: "[start,end)"
                    denominator_definition: eligible_receptions
                  source: insight_page
      responses:
