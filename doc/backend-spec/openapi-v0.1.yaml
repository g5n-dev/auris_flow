      tags: [prompt-release]
      summary: 由项目管理员一次性确认初始 Last Known Good
      description: >
        仅用于 production 尚无 active head 的首次迁移。目标必须只因缺失 rollback target/active head 而 blocked，
        无 active command、无歧义 completed 部署，且完整 Bundle 可重新通过门禁；system 不得代签。
        确认后该部署成为 completed/100% 的初始 LKG。后续切换必须走 ReleaseCommand 两阶段 ACK 与 generation CAS。
      operationId: postReleaseDeploymentBootstrapActiveHead
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XProjectId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: deployment_id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReleaseHeadBootstrapRequest"
      responses:
        "200":
          description: 初始 LKG 部署与 active head 已在审计和 Outbox 同事务内固化
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseDeploymentResponse"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /release-deployments/{deployment_id}/transitions:
    post:
      tags: [prompt-release]
      summary: 请求人工批准 10% gray、人工晋级或回滚命令
      description: >
        approve-gray/promote 不能由系统身份代签。expected_status 与当前状态不一致、Bundle blocked、
        监控门禁失败或回滚目标不稳定时返回 409，前端必须展示阻断而非成功。每次推进重新校验
        Eval Manifest、强评测、Prompt 双盲证据、Bundle 与回滚目标；客户端 monitor_metrics 非空时拒绝。
        202 只创建唯一 active ReleaseCommand/RunRecord 并进入 materializing，必须等待受信 completion receipt
        回传 command SHA、Bundle SHA、动作和 applied=true，且 active head generation CAS 成功后才改变有效发布状态。
      operationId: postReleaseDeploymentTransitions
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XProjectId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: deployment_id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReleaseDeploymentTransitionRequest"
      responses:
        "202":
          description: 发布命令已创建并等待可信执行 ACK；不是灰度、晋级或回滚成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseDeploymentResponse"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /release-deployments/{deployment_id}/monitor-samples:
    post:
      tags: [prompt-release]
      summary: 写入在线监控样本并执行硬阈值自动保护
      description: >
        仅 system 服务身份可调用。无硬退化时进入 monitoring；命中硬阈值立即把 rollout 置零，
        有稳定锁定目标则创建自动 rollback ReleaseCommand 并进入 materializing，可信 ACK 后才成为 rolled-back；
        无稳定目标则 safe-stop 为 blocked。stable_window_complete 由 system
        监控样本写入权威 monitor_metrics，只有为 true 且其余门禁通过时自然人才可 promote。
        重复 sample_id 内容必须一致。
      operationId: postReleaseDeploymentMonitorSamples
      x-required-roles: [system]
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XProjectId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: deployment_id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReleaseMonitorSampleRequest"
      responses:
        "200":
          description: 监控样本已持久化；返回 monitoring、materializing、rolled-back 或 blocked 权威状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseDeploymentResponse"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

