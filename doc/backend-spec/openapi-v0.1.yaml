                value:
                  status: success
                  adapter: dagster
                  completion_receipt_id: receipt_metric_20250531_001
                  external_id: dagster-run-7f4a21
                  result_ref:
                    metric_results:
                      - metric_key: reception_conversion_quality
                        value: 82.4
                        unit: score
                        sample_size: 1204
                      - metric_key: quote_consistency
                        value: 74.2
                        unit: percent
                        sample_size: 842
