      summary: 下载已完成的导出对象
      description: >
        受鉴权且按 tenant/project 作用域读取的 BFF 下载路由。BFF 使用服务端保存的强 ETag
        和对象版本定位器访问对象存储，支持单区间 Range；响应不会暴露上游对象定位器。
      operationId: getExportsByIdDownload
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XProjectId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/AudioRange"
      responses:
        "200":
          description: 完整导出对象
          headers:
            Accept-Ranges: {schema: {type: string, enum: [bytes]}}
            Content-Length: {schema: {type: integer}}
            ETag: {schema: {type: string}}
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        "206":
          $ref: "#/components/responses/AudioPartialContent"
        "416":
          $ref: "#/components/responses/AudioRangeNotSatisfiable"
        default:
          $ref: "#/components/responses/Error"
    head:
      tags: [exports]
      summary: 读取已完成导出对象元数据
      description: >
        与 GET 相同的鉴权、tenant/project 作用域、强 ETag 和 Range 语义；仅返回响应头，
        不返回正文，也不会暴露上游对象定位器。
      operationId: headExportsByIdDownload
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XProjectId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/AudioRange"
      responses:
        "200":
          description: 完整导出对象元数据
          headers:
            Accept-Ranges: {schema: {type: string, enum: [bytes]}}
            Content-Length: {schema: {type: integer}}
            ETag: {schema: {type: string}}
        "206":
          $ref: "#/components/responses/AudioPartialContent"
        "416":
          $ref: "#/components/responses/AudioRangeNotSatisfiable"
        default:
          $ref: "#/components/responses/Error"

