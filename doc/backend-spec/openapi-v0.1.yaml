      type: object
      additionalProperties: false
      required:
        - id
        - appeal_id
        - source_decision_id
        - source_review_task_id
        - review_task_id
        - appeal_decision_id
        - source_result_sha256
        - source_decider_id
        - source_trace_id
        - root_trace_id
        - current_trace_id
        - appellant_id
        - evidence_refs
        - reason
        - status
        - reviewer_id
        - decision
        - decision_reason
        - withdrawal_reason
        - resource_version
        - claimed_at
        - resolved_at
        - withdrawn_at
        - created_at
        - updated_at
      properties:
        id:
          type: string
        appeal_id:
          type: string
        source_decision_id:
          type: string
          description: 被申诉的终态 HumanReviewDecision ID，创建后冻结。
        source_review_task_id:
          type: string
          description: 源裁决的 terminal_review_task_id，创建后冻结。
        review_task_id:
          type: string
          description: 本申诉独立 queue=quality_appeal 的 HumanReviewTask ID，创建后冻结。
        appeal_decision_id:
          type: string
          nullable: true
          description: >
            resolved 时必填，强引用属于 review_task_id 的唯一终态 HumanReviewDecision；
            withdrawn 和未结案状态为 null。
        source_result_sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: 服务端对源裁决规范化快照计算的 SHA-256，创建后冻结。
        source_decider_id:
          type: string
          description: 原人审裁决人，创建后冻结并用于 reviewer 回避。
        source_trace_id:
          type: string
          description: 直接源 HumanReviewDecision 的 trace_id，创建后冻结。
        root_trace_id:
          type: string
          description: 源裁决证据链根 trace，创建后冻结。
        current_trace_id:
          type: string
          description: 最近一次成功状态迁移的 trace_id。
        appellant_id:
          type: string
          description: 从认证上下文读取的申请人，创建后冻结。
        evidence_refs:
          type: array
          minItems: 1
          maxItems: 50
          description: 创建后冻结的证据引用。
          items:
            type: string
            minLength: 1
            maxLength: 512
        reason:
          type: string
          minLength: 1
          maxLength: 2000
        status:
          $ref: "#/components/schemas/QualityAppealStatus"
        reviewer_id:
          type: string
          nullable: true
        decision:
          allOf:
            - $ref: "#/components/schemas/QualityAppealDecision"
          nullable: true
        decision_reason:
          type: string
          nullable: true
        withdrawal_reason:
          type: string
          nullable: true
        resource_version:
          type: integer
          minimum: 1
        claimed_at:
          type: string
          format: date-time
          nullable: true
        resolved_at:
          type: string
          format: date-time
          nullable: true
        withdrawn_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
