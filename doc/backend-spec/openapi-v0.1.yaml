                    materialized_count: 2
      responses:
        "200":
          description: 运行已完成；指标聚合运行同时返回物化结果 ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObjectResponse"
              examples:
                insightMetricAggregationMaterialized:
                  summary: 指标聚合完成并返回可创建报告的结果 ID
                  value:
                    data:
                      id: insight_metric_aggregation_7f4a21c8d390
                      run_id: insight_metric_aggregation_7f4a21c8d390
                      run_type: insight_metric_aggregation
                      status: success
                      metric_keys: [reception_conversion_quality, quote_consistency]
                      metric_result_ids: [metric_54d9b7cce5344ada9f18c2ad, metric_761d40ce30174c54a908cd9f]
                      insight_completion:
                        source_run_id: insight_metric_aggregation_7f4a21c8d390
                        status: materialized
                        metric_result_ids: [metric_54d9b7cce5344ada9f18c2ad, metric_761d40ce30174c54a908cd9f]
                        metric_count: 2
                        scope:
                          time_range: 2025-05-01/2025-05-31
                          store_ids: [BJ-AURORA-001]
                          model_version: prod-v5
                          label_version: v1.9.0-rc2
                      trace_id: trace_metric_7f4a21
                    meta:
                      trace_id: trace_metric_completion_0cd341
                      request_id: req_metric_completion_001
        default:
          $ref: "#/components/responses/Error"

