        fact cutoff、候选 namespace、完整分区/资产范围、覆盖策略和预算。服务端预留候选
        FactSet 并为每个分区创建内部执行映射；API 不暴露底层 Dagster 画布或 run ID。
      operationId: postLabelRecomputeRuns
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XProjectId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LabelRecomputeRunCreateRequest"}
      responses:
        "201":
          description: 已冻结重算请求及全部分区 Item
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LabelRecomputeMutationEnvelope"}
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: {$ref: "#/components/responses/Error"}

  /label-recompute-runs/{run_id}/items/{item_id}/completions:
    post:
      tags: [label-recomputations]
      summary: 接收一个重算分区的可信完成回执
      description: >
        仅接受当前 attempt 所绑定的内部执行终态与持久化成功/失败回执。成功时服务端验证
        Observation→Aggregate lineage 并写 append-only candidate LabelFact；row_count 和全部
        source/result/content SHA 均从实际数据库行重算，调用方不能提交这些值。
      operationId: postLabelRecomputeRunItemsByIdCompletions
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XProjectId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: run_id
          in: path
          required: true
          schema: {type: string}
        - name: item_id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LabelRecomputeRunItemCompletionRequest"}
      responses:
        "200":
          description: 分区终态已物化；全部成功时同时冻结完整候选 FactSet manifest
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LabelRecomputeRunItemMutationEnvelope"}
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: {$ref: "#/components/responses/Error"}

  /label-recompute-runs/{run_id}/items/{item_id}/retries:
    post:
      tags: [label-recomputations]
      summary: CAS 重试一个失败重算分区
      description: >
        仅 retryable 失败 Item 可按 expected attempt generation 重试；新 attempt 获得新的内部
        执行映射，旧回执和失败审计保留，重复请求精确重放且不重复写候选事实。
      operationId: postLabelRecomputeRunItemsByIdRetries
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XProjectId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: run_id
          in: path
          required: true
          schema: {type: string}
        - name: item_id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LabelRecomputeRunItemRetryRequest"}
      responses:
        "200":
          description: 已创建下一代分区 attempt 或精确重放
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LabelRecomputeRunItemMutationEnvelope"}
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: {$ref: "#/components/responses/Error"}

  /label-versions/{id}/deprecation-preflights:
    post:
      tags: [label-lifecycle]
      summary: 预检标签版本废弃条件
      description: >
        在同一事务快照中校验 CAS、替代版本、映射包、active Head、draining 部署与
        in-flight 运行引用，并按稳定游标分页返回 FactSet、Label MetricResult、冻结
        ReportDocument 绑定和可识别下游资产。扫描超上限 fail-closed；预检只生成
        审计和 Outbox 事实，不改变标签版本状态。
      operationId: postLabelVersionsByIdDeprecationPreflights
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XProjectId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LabelVersionDeprecationPreflightRequest"
      responses:
        "200":
          description: 当前快照下的废弃预检结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabelVersionDeprecationPreflightResponse"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /label-versions/{id}/transitions:
    post:
      tags: [label-lifecycle]
      summary: 废弃或归档标签版本
      description: >
        仅实名人工 project_admin 可执行。服务端重新执行完整预检，并原子更新强表、
        JSON 投影、Audit 与 Outbox；当前 FactSet Head、进行中候选和发布下游引用必须先
        切换，冻结 MetricResult/Report 仅作 historical-reference，不阻断无 replacement
        retire；历史 Observation、Aggregate、Fact、MetricResult、Report 不改写。
      operationId: postLabelVersionsByIdTransitions
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XProjectId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LabelVersionTransitionRequest"
      responses:
        "200":
          description: 标签版本生命周期已完成原子变更
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabelVersionTransitionResponse"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

