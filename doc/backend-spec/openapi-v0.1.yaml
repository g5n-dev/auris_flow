  /task-runs/{id}/cancellations:
    post:
      tags: [task-runs]
      summary: 请求取消任务运行
      description: >
        在租户与项目范围内创建独立取消控制运行和 outbox 事件。已绑定 Dagster 的运行使用
        SAFE_TERMINATE；尚未分发的运行在本地安全取消。已进入终态的运行返回稳定 409，
        同一个 Idempotency-Key 只产生一次控制运行和一次终态收敛。
      operationId: postTaskRunsByIdCancellations
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XProjectId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskRunCancellationRequest"
      responses:
        "202":
          description: 已创建独立取消控制运行
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunActionResponse"
        default:
          $ref: "#/components/responses/Error"

  /task-runs/{id}/status-syncs:
    post:
      tags: [task-runs]
      summary: 请求同步任务运行的执行引擎状态
      description: >
        创建独立状态同步控制运行并查询可信 Dagster run binding。Dagster SUCCESS 只把业务运行
        收敛到 completion_pending，不能伪造业务 success；业务成功仍必须由外部 ID 匹配的签名完成回执确认。
      operationId: postTaskRunsByIdStatusSyncs
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XProjectId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskRunStatusSyncRequest"
      responses:
        "202":
          description: 已创建独立状态同步控制运行
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunActionResponse"
        default:
          $ref: "#/components/responses/Error"

  /task-runs/{id}/completion-receipts:
    post:
      tags: [task-runs]
      summary: 接收任务运行的业务完成回执
      description: >
        仅允许 `submitted` 且 `business_completion_required=true` 的运行接收完成回执。
        服务端会校验 adapter、外部 run id 和幂等键，成功后把运行迁移到 `success` 或 `failed`。
        `execution_mode=experiment` 的成功回执必须包含实验声明的全部主指标与守护指标；
        服务端在同一事务中将它们物化为绑定曝光的不可变 ExperimentOutcome，缺项或非有限数值会整体回滚。
        `run_type=release_command` 时，result_ref 还必须精确回显 release_command_id、command_sha256、
        deployment_id、environment、action、bundle_sha256 与 applied=true；服务端随后重验 Bundle、
        expected head generation/deployment/hash，并以 CAS 切换唯一 active head。
      operationId: postTaskRunsByIdCompletionReceipts
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XProjectId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Id"
      requestBody:
        $ref: "#/components/requestBodies/RunCompletionReceipt"
      responses:
        "200":
          $ref: "#/components/responses/GenericObject"
        default:
          $ref: "#/components/responses/Error"

