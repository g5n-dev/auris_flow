                $ref: "#/components/schemas/RunActionResponse"
        default:
          $ref: "#/components/responses/Error"

  /output-sinks/platform-callbacks/{id}/completion-receipts:
    post:
      tags: [output-sinks]
      summary: 接收外部平台回写确认回执
      description: >
        平台 callback 派发成功只代表对端接收了请求；业务完成回执用于记录远端系统是否真正处理完成，
        并把 completion ack 写回 callback receipt。
      operationId: postOutputSinksPlatformCallbacksByIdCompletionReceipts
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XProjectId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Id"
      requestBody:
        $ref: "#/components/requestBodies/RunCompletionReceipt"
      responses:
        "200":
          $ref: "#/components/responses/GenericObject"
        default:
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    browserSession:
      type: apiKey
      in: cookie
      name: __Host-auris_session
      description: >
        prod/release 的不透明 HttpOnly browser session；数据库只保存 token SHA-256。
        local/test/ci 可配置为 auris_session 以支持本地 HTTP。
    aurisCompletionSignature:
      type: apiKey
      in: header
      name: X-Auris-Signature
      description: 规范请求消息的 HMAC-SHA256 签名。
    aurisCompletionKeyId:
      type: apiKey
      in: header
      name: X-Auris-Key-Id
      description: 完成回执签名密钥标识。
    aurisCompletionLegacyKeyId:
      type: apiKey
      in: header
      name: X-Auris-Signature-Id
      description: 兼容旧客户端的完成回执签名密钥标识。
      x-deprecated: true
  parameters:
    XTenantId:
      name: X-Tenant-Id
      in: header
      required: true
      schema:
        type: string
      description: 租户上下文，服务端必须与 token 授权范围校验。
    XProjectId:
      name: X-Project-Id
      in: header
      required: true
      schema:
        type: string
      description: 项目上下文，服务端必须与成员权限校验。
    OptionalXTenantId:
      name: X-Tenant-Id
      in: header
      required: false
      schema:
        type: string
      description: >
        bearer 兼容路径的显式租户上下文；浏览器会话可省略并使用会话绑定值，提供时必须精确匹配。
    OptionalXProjectId:
      name: X-Project-Id
      in: header
      required: false
      schema:
        type: string
      description: >
        bearer 兼容路径的显式项目上下文；浏览器会话可省略并使用会话绑定值，提供时必须精确匹配。
    XRequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
      description: 可选客户端请求 ID；缺失时服务端生成新的 request_id。
    XTraceId:
      name: X-Trace-Id
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
      description: 可选 parent trace 上下文；服务端始终生成当前 trace，并在响应头/包络返回实际 trace_id。
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
      description: 写操作和异步动作必填。
    XAurisKeyId:
      name: X-Auris-Key-Id
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
      description: >
        规范签名 key 标识；必须与弃用的 X-Auris-Signature-Id 至少提供一个。
    XAurisSignatureId:
      name: X-Auris-Signature-Id
      in: header
      required: false
      deprecated: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
      description: 兼容旧客户端的 key 标识；新客户端应使用 X-Auris-Key-Id。
    XAurisTimestamp:
      name: X-Auris-Timestamp
      in: header
      required: true
      schema:
        type: string
        minLength: 1
      description: 签名时间戳；接受 Unix 秒或带时区的 RFC 3339 时间。
    XAurisNonce:
      name: X-Auris-Nonce
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
      description: 单次请求随机值；同一签名 key 下重放会被拒绝。
    XAurisSource:
      name: X-Auris-Source
      in: header
      required: true
      schema:
        type: string
        enum: [dagster, object_storage, external_callback]
      description: 已绑定签名 key 且与请求体 adapter 一致的真实执行来源。
    XAurisSignatureMode:
      name: X-Auris-Signature-Mode
      in: header
      required: true
      schema:
        type: string
        enum: [hmac-sha256]
      description: 完成回执签名算法；当前仅支持 hmac-sha256。
    XAurisSignature:
      name: X-Auris-Signature
      in: header
      required: true
      schema:
        type: string
        pattern: '^(?:sha256=)?[0-9A-Fa-f]{64}$'
      description: 规范请求消息的 HMAC-SHA256；接受 sha256= 前缀或裸十六进制。
    XCsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      schema:
        type: string
        minLength: 32
      description: >
        cookie 认证的写操作必填，并与受信 Origin 一起校验；bearer 认证不使用此 token。
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
      description: 不透明游标。
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 50
        maximum: 200
    Search:
      name: q
      in: query
      schema:
        type: string
    Sort:
      name: sort
      in: query
      schema:
        type: string
        example: -created_at
    Status:
      name: status
      in: query
      schema:
        type: string
        enum: [pending, running, submitted, success, failed, blocked, cancelled]
    ExperimentStatus:
      name: status
      in: query
      schema:
        type: string
        enum: [draft, running, paused, stopped, decided, archived]
    TimeRange:
      name: time_range
      in: query
      schema:
        type: string
        enum: [today, 7d, 30d, 90d, custom]
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
    AnnotationId:
      name: annotation_id
      in: path
      required: true
      schema:
        type: string
        minLength: 3
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$'
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    SceneProfileId:
      name: scene_profile_id
      in: path
      required: true
      schema:
        type: string
        minLength: 3
        maxLength: 128
    SceneProfileVersionId:
      name: scene_profile_version_id
      in: path
      required: true
      schema:
        type: string
        minLength: 3
        maxLength: 128
    ExperimentId:
      name: experiment_id
      in: path
      required: true
      schema:
        type: string
        minLength: 2
        maxLength: 128
    BadcaseId:
      name: badcase_id
      in: path
      required: true
      schema:
        type: string
    PackId:
      name: pack_id
      in: path
      required: true
      schema:
        type: string
    VersionId:
      name: version_id
      in: path
      required: true
      schema:
        type: string
    ItemId:
      name: item_id
      in: path
      required: true
      schema:
        type: string
    AssetKey:
      name: asset_key
      in: path
      required: true
      schema:
        type: string
      description: >
        URL 编码后的数据资产键。原始 asset_key 可包含 `/`，
        例如 `auris/label/event_tags` 在路径中应传为 `auris%2Flabel%2Fevent_tags`。
    AudioPlaybackGrant:
      name: grant
      in: query
      required: true
      description: 短期 HMAC 签名播放授权，绑定租户、项目、用户、音频会话和存储对象版本。
      schema:
        type: string
        minLength: 1
    AudioRange:
      name: Range
      in: header
      required: false
      description: >
        RFC 9110 单字节区间。支持闭区间、开放尾端和后缀区间；多区间与无效或不可满足区间返回 416。
      schema:
        type: string
        example: bytes=0-65535
    AudioIfRange:
      name: If-Range
      in: header
      required: false
      description: 登记对象的 ETag；不匹配时忽略 Range 并返回完整表示。
      schema:
        type: string
        example: '"recording-etag"'
  requestBodies:
    GenericRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GenericRequest"
    RunCompletionReceipt:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RunCompletionReceiptRequest"
    ExternalRunCompletionReceipt:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ExternalRunCompletionReceiptRequest"
    CreateWorkItem:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CreateWorkItemRequest"
    UpdateWorkItem:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UpdateWorkItemRequest"
    CreateEventLink:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CreateEventLinkRequest"
    UpdateEventLink:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UpdateEventLinkRequest"
  responses:
    AudioFullContent:
      description: 完整音频字节
      headers:
        Accept-Ranges:
          schema:
            type: string
            enum: [bytes]
        Content-Length:
          schema:
            type: integer
        ETag:
          schema:
            type: string
      content:
        audio/wav:
          schema:
            type: string
            format: binary
    AudioPartialContent:
      description: 满足单区间请求的音频字节
      headers:
        Accept-Ranges:
          schema:
            type: string
            enum: [bytes]
        Content-Range:
          required: true
          schema:
            type: string
            example: bytes 0-65535/320044
        Content-Length:
          schema:
            type: integer
        ETag:
          schema:
            type: string
      content:
        audio/wav:
          schema:
            type: string
            format: binary
    AudioHeadFullContent:
      description: 完整音频表示的元数据，不包含响应正文
      headers:
        Accept-Ranges:
          schema:
            type: string
            enum: [bytes]
        Content-Length:
          required: true
          schema:
            type: integer
        ETag:
          schema:
            type: string
    AudioHeadPartialContent:
      description: 满足单区间请求的音频元数据，不包含响应正文
      headers:
        Accept-Ranges:
          schema:
            type: string
            enum: [bytes]
        Content-Range:
          required: true
          schema:
            type: string
            example: bytes 0-65535/320044
        Content-Length:
          required: true
          schema:
            type: integer
        ETag:
          schema:
            type: string
    AudioRangeNotSatisfiable:
      description: 多区间、格式错误或不可满足的 Range
      headers:
        Accept-Ranges:
          schema:
            type: string
            enum: [bytes]
        Content-Range:
          required: true
          schema:
            type: string
            example: bytes */320044
    GenericObject:
      description: 统一单对象响应。具体最低字段见 api-contract.md 对应接口表。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GenericObjectResponse"
    EvalDatasetVersionObject:
      description: 已登记 manifest 与内容哈希绑定的评测集版本。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EvalDatasetVersionResponse"
    GenericList:
      description: 统一列表响应。列表接口必须支持游标分页或在接口说明中明确不分页。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GenericListResponse"
    AcceptedRun:
      description: 异步运行已创建或进入审批队列
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RunActionResponse"
    WorkItemObject:
      description: 可追踪处理草稿
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WorkItemResponse"
    WorkItemList:
      description: 可追踪处理草稿列表
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WorkItemListResponse"
    TraceObject:
      description: 跨模块 trace 投影
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TraceResponse"
    EventLinkObject:
      description: 音频和业务事件关联
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EventLinkResponse"
    EventLinkList:
      description: 音频和业务事件关联列表
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EventLinkListResponse"
    LabelOptimizationRunObject:
      description: 标签或 Prompt 优化运行详情
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LabelOptimizationRunResponse"
    DataAssetObject:
      description: 数据资产详情
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DataAssetResponse"
    DataAssetList:
      description: 数据资产列表
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DataAssetListResponse"
    DataAssetPartitionList:
      description: 数据资产分区列表
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DataAssetPartitionListResponse"
    DataAssetMaterializationList:
      description: 数据资产生成记录列表
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DataAssetMaterializationListResponse"
    CalibrationRoundObject:
      description: 校准轮次投影；reviewer 响应不包含参与者身份。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CalibrationRoundResponse"
    CalibrationRoundList:
      description: 校准轮次列表
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CalibrationRoundListResponse"
    CalibrationAssignmentList:
      description: 当前 reviewer 的盲审 assignment 列表
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CalibrationAssignmentListResponse"
    CalibrationConflictList:
      description: adjudicator 可见的冲突列表及 A/B 密封答案
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CalibrationConflictListResponse"
    CalibrationActionObject:
      description: 密封提交、领取或裁决的执行结果
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CalibrationActionResponse"
    CalibrationGoldReleaseObject:
      description: 不可变金标版本发布结果
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CalibrationGoldReleaseResponse"
    GoldSetVersionList:
      description: 不可变金标版本列表
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GoldSetVersionListResponse"
    GoldSetVersionObject:
      description: 金标版本及 annotation 快照
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GoldSetVersionResponse"
    Error:
      description: 统一错误响应
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    AuthSessionUser:
      type: object
      additionalProperties: false
      required:
        [user_id, name, email, role, roles, initials, tenant_id, tenant_name, project_id, project_name]
      properties:
        user_id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
        roles:
          type: array
          minItems: 1
          items:
            type: string
        initials:
          type: string
        tenant_id:
          type: string
        tenant_name:
          type: string
        project_id:
          type: string
        project_name:
          type: string
        provider:
          type: string
          enum: [oidc_session, oidc_bearer, dev_session, configured]
          description: 服务端实际认证提供方；浏览器不得用该字段推导权限。
        csrf_token:
          type: string
          minLength: 32
          description: >
            仅浏览器 cookie 会话返回的轮换 CSRF token；只保存在前端内存，写操作经
            X-CSRF-Token 回传。bearer/dev-login 响应可省略。
    AuthLoginResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [access_token, token_type, expires_at, user]
          properties:
            access_token:
              type: string
              description: >
                仅用于 local/test/ci 的短期签名兼容会话；前端只在内存持有，不写入
                localStorage/sessionStorage。prod/release 禁用 dev-login，OIDC token 不返回浏览器。
            token_type:
              type: string
              enum: [Bearer]
            expires_at:
              type: string
              format: date-time
            user:
              $ref: "#/components/schemas/AuthSessionUser"
        meta:
          $ref: "#/components/schemas/ApiMeta"
    AuthSessionResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: "#/components/schemas/AuthSessionUser"
        meta:
          $ref: "#/components/schemas/ApiMeta"
    AuthLogoutResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [status, session_id, revoked_at]
          properties:
            status:
              type: string
              enum: [revoked]
            session_id:
              type: string
            revoked_at:
              type: string
              format: date-time
        meta:
          $ref: "#/components/schemas/ApiMeta"
    RunStatus:
      type: string
      enum: [queued, pending, running, submitted, completion_pending, cancelling, success, failed, blocked, cancelled]
    EntityStatus:
      type: string
      enum: [pending, running, submitted, success, failed, blocked, cancelled, draft, active, inactive, normal, warning, risk, published, archived]
    LabelVersionStatus:
      type: string
      enum: [draft, candidate, validated, locked, evaluating, gate_blocked, review_required, approved, published, deprecated, archived]
      description: >
        目标 LabelVersion 制品生命周期。legacy gray_releasing/rollback_pending/rolled_back
        在迁移期只读映射到环境 activation ledger，不再允许新写；环境 active/draining/rolled-back
        由 ReleaseDeployment 与 ReleaseBundleHead 表达。
    LabelTaxonomyMode:
      type: string
      enum: [native, normalized, recomputed]
    LabelMappingRelation:
      type: string
      enum: [identity, rename, replace, merge, retire, split-recompute]
    LabelMappingCompatibility:
      type: string
      enum: [exact, metric-dependent, structural-break, not-applicable]
      description: >
        映射本身的语义兼容性；merge 通常是 metric-dependent，不能因一对一基数
        自动声明 exact。指标结果仍须单独计算 LabelComparabilityStatus。
    LabelComparabilityStatus:
      type: string
      enum: [comparable, partial, structural-break, not-applicable]
    LabelVersionApplicability:
      type: string
      enum: [required, none]
      description: 由服务端指标目录声明；客户端不得把标签派生指标自报为 none。
    ApiMeta:
      type: object
      properties:
        trace_id:
          type: string
        request_id:
          type: string
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
        has_next:
          type: boolean
        next_cursor:
          type: string
        status_counts:
          type: object
          additionalProperties:
            type: integer
    ApiLinks:
      type: object
      properties:
        self:
          type: string
        next:
          type: string
    SceneRoleDefinition:
      type: object
      additionalProperties: false
      required: [role_key, display_name, description]
      properties:
        role_key: {type: string, minLength: 2, maxLength: 96}
        display_name: {type: string, minLength: 1, maxLength: 128}
        description: {type: string, minLength: 1, maxLength: 1000}
    SceneObjectDefinition:
      type: object
      additionalProperties: false
      required: [object_key, display_name]
      properties:
        object_key: {type: string, minLength: 2, maxLength: 96}
        display_name: {type: string, minLength: 1, maxLength: 128}
        schema_ref: {type: string, maxLength: 256, nullable: true}
        required: {type: boolean, default: false}
    SceneDimensionDefinition:
      type: object
      additionalProperties: false
      required: [dimension_key, display_name, scope_level]
      properties:
        dimension_key: {type: string, minLength: 2, maxLength: 96}
        display_name: {type: string, minLength: 1, maxLength: 128}
        value_type:
          type: string
          enum: [string, date, datetime, number, boolean, id]
          default: string
        scope_level:
          type: string
          enum: [tenant, project, organization, location, object, run]
        required: {type: boolean, default: false}
    SceneActionBinding:
      type: object
      additionalProperties: false
      required: [action_key, display_name, capability]
      properties:
        action_key: {type: string, minLength: 2, maxLength: 96}
        display_name: {type: string, minLength: 1, maxLength: 128}
        capability: {type: string, minLength: 1, maxLength: 128}
        task_type_ref: {type: string, nullable: true}
        data_contract_refs:
          type: array
          maxItems: 32
          uniqueItems: true
          items: {type: string}
        connector_refs:
          type: array
          maxItems: 32
          uniqueItems: true
          items: {type: string}
        model_service_refs:
          type: array
          maxItems: 32
          uniqueItems: true
          items: {type: string}
        label_version_ref: {type: string, nullable: true}
        prompt_version_ref: {type: string, nullable: true}
        knowledge_index_ref: {type: string, nullable: true}
        eval_dataset_version_ref: {type: string, nullable: true}
        hotword_pack_version_ref: {type: string, nullable: true}
        rubric_ref: {type: string, nullable: true}
        gold_set_key: {type: string, nullable: true}
        output_sink_refs:
          type: array
          maxItems: 32
          uniqueItems: true
          items: {type: string}
        human_review_required: {type: boolean, default: false}
    SceneMetricDefinition:
      type: object
      additionalProperties: false
      required: [metric_key, display_name, unit, calculator_ref]
