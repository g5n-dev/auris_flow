          $ref: "#/components/responses/Error"
    post:
      tags: [prompt-release]
      summary: 创建锁定 label/Prompt/model/policy/eval/rollback target 的发布 Bundle
      description: >
        201 仅表示 Bundle 已创建；data.status 只能先为 pending 或 blocked，不表示已进入 Shadow、更不表示已发布。
        只接受完整可重算且 status=passed 的强评测结果；Prompt 必须具备两份独立密封审核一致接受或
        独立仲裁接受证据。production 必须绑定同环境、completed、100% rollout 且 Bundle hash 可重算的回滚目标。
        门禁通过时服务端同时创建 publish ReleaseCommand；受信 completion receipt 通过命令绑定与 head CAS 后，
        部署才进入 shadowing。
      operationId: postReleaseDeployments
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XProjectId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReleaseDeploymentRequest"
      responses:
        "201":
          description: Bundle 已冻结；若无阻断则返回 pending command/run，等待可信 ACK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseDeploymentResponse"
        default:
          $ref: "#/components/responses/Error"

