openapi: 3.0.3
info:
  title: Auris Flow BFF API
  version: 0.1.0
  description: >
    Auris Flow 一期 FastAPI BFF 契约草案。前端只访问 BFF，
    不直接访问 MySQL、Qdrant、对象存储或执行引擎。MySQL 是标签、Prompt、评测与发布唯一业务真相源；
    Redis 仅用于缓存/幂等，Qdrant 仅用于召回；不引入 ClickHouse，产品界面不暴露 Dagster 语言。
servers:
  - url: /api/v1
    description: BFF v1
security:
  - bearerAuth: []
  - browserSession: []
tags:
  - name: auth
  - name: ops
  - name: tenants
  - name: projects
  - name: scene-profiles
  - name: connectors
  - name: task-runs
  - name: experiments
  - name: audio-sessions
  - name: human-review
  - name: calibrations
  - name: quality-appeals
  - name: labels
  - name: label-lifecycle
  - name: label-mappings
  - name: label-fact-sets
  - name: label-closed-loop
  - name: prompt-release
  - name: knowledge
  - name: insights
  - name: evaluation
  - name: hotword-governance
  - name: data-assets
  - name: settings
  - name: output-sinks
  - name: traces
  - name: work-items
  - name: exports

paths:
  /auth/dev-login:
    post:
      tags: [auth]
      summary: 本地开发环境登录并签发短期范围会话
      operationId: postAuthDevLogin
      security: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 1
                  writeOnly: true
      responses:
        "200":
          description: 服务端签发的本地开发会话；同时设置 HttpOnly 兼容会话 cookie
          headers:
            Set-Cookie:
              description: >
                local/test/ci 的 HttpOnly、SameSite=Lax 会话 cookie；生产环境禁用 dev-login。
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthLoginResponse"
        default:
          $ref: "#/components/responses/Error"

  /auth/oidc/login:
    get:
      tags: [auth]
      summary: 发起通用 OIDC Authorization Code + PKCE 登录
      description: >
        生成一次性 state、nonce 和 PKCE S256 challenge，持久化短期服务端状态后以 303
        重定向至配置的标准 OIDC Provider。return_path 只接受站内绝对路径，拒绝开放重定向。
        Keycloak 可作为参考 IdP，但该接口不依赖 Keycloak 私有协议。
      operationId: getAuthOidcLogin
      security: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
        - name: return_path
          in: query
          required: false
          description: 登录成功后的站内绝对路径；缺省为 `/`，不接受 scheme、host 或协议相对 URL。
          schema:
            type: string
            maxLength: 1024
            example: /insights
      responses:
        "303":
          description: 重定向至 OIDC Provider authorization endpoint
          headers:
            Location:
              description: 含 state、nonce 和 code_challenge_method=S256 的 Provider URL。
              schema:
                type: string
                format: uri
            Cache-Control:
              description: 固定为 no-store。
              schema:
                type: string
                enum: [no-store]
        default:
          $ref: "#/components/responses/Error"

  /auth/oidc/callback:
    get:
      tags: [auth]
      summary: 完成 OIDC 回调并建立不透明浏览器会话
      description: >
        一次性消费 state，以 PKCE verifier 交换 code，校验 issuer、audience、RS256 签名、exp、iat
        与 nonce，并仅映射预配置的内部 OIDC identity。服务端不把 IdP access/ID/refresh token
        返回给浏览器；成功后只设置不透明 HttpOnly cookie，其原值不落库。
      operationId: getAuthOidcCallback
      security: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
        - name: code
          in: query
          required: false
          description: Provider 返回的一次性 authorization code；授权失败响应可不包含。
          schema:
            type: string
            minLength: 1
        - name: state
          in: query
          required: true
          description: 必须精确匹配尚未过期、未消费的服务端 state hash 记录。
          schema:
            type: string
            minLength: 32
        - name: iss
          in: query
          required: false
          description: Provider 返回时必须与配置的 issuer 精确一致（如果存在）。
          schema:
            type: string
            format: uri
        - name: error
          in: query
          required: false
          description: OIDC 标准授权错误；存在时回调 fail closed，且不回显敏感详情。
          schema:
            type: string
      responses:
        "303":
          description: 已建立浏览器会话并重定向至经校验的站内 return_path
          headers:
            Location:
              description: 发起登录时冻结并校验的站内路径。
              schema:
                type: string
            Set-Cookie:
              description: >
                不透明 HttpOnly、SameSite=Lax 会话 cookie；prod/release 使用
                `__Host-auris_session` 并强制 Secure、Path=/、无 Domain。
              schema:
                type: string
            Cache-Control:
              description: 固定为 no-store。
              schema:
                type: string
                enum: [no-store]
        default:
          $ref: "#/components/responses/Error"

  /auth/session:
    get:
      tags: [auth]
      summary: 恢复当前 bearer 或浏览器会话及动态权限范围
      description: >
        浏览器 cookie 会话可不提供租户/项目 Header，服务端使用会话绑定 scope；如显式提供则必须
        精确匹配。每次读取当前用户、identity、租户、项目和项目成员角色，禁用或降权即时生效。
        浏览器会话响应轮换并返回仅保存在前端内存中的 csrf_token。
      operationId: getAuthSession
      security:
        - bearerAuth: []
        - browserSession: []
      parameters:
        - $ref: "#/components/parameters/OptionalXTenantId"
        - $ref: "#/components/parameters/OptionalXProjectId"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: 当前认证会话；响应禁止缓存
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        default:
          $ref: "#/components/responses/Error"

  /auth/logout:
    post:
      tags: [auth]
      summary: 撤销当前 bearer 或不透明浏览器会话
      description: >
        浏览器 cookie 路径要求 X-CSRF-Token 与受信 Origin，并清除 cookie；无需租户/项目 Header。
        开发 bearer 兼容路径仍要求显式 scope Header。重复撤销保持幂等。
      operationId: postAuthLogout
      security:
        - bearerAuth: []
        - browserSession: []
      parameters:
        - $ref: "#/components/parameters/OptionalXTenantId"
        - $ref: "#/components/parameters/OptionalXProjectId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/XCsrfToken"
      responses:
        "200":
          description: 当前会话已撤销；重复提交保持幂等
          headers:
            Set-Cookie:
              description: 浏览器会话路径通过 Max-Age=0 清除原会话 cookie。
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthLogoutResponse"
        default:
          $ref: "#/components/responses/Error"

  /insights/ops-summary:
    get:
      tags: [ops]
      summary: 运营首页摘要
      operationId: getInsightsOpsSummary
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XProjectId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/TimeRange"
      responses:
        "200":
          description: 运营摘要
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsSummaryResponse"
        default:
          $ref: "#/components/responses/Error"

  /data-assets/recent:
    get:
      tags: [data-assets]
      summary: 首页最近资产和异常资产
      operationId: getDataAssetsRecent
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XProjectId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/TimeRange"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/DataAssetList"
        default:
          $ref: "#/components/responses/Error"

  /work-items:
    get:
      tags: [work-items]
      summary: 可追踪处理草稿列表
      operationId: getWorkItems
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XProjectId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Status"
      responses:
        "200":
          $ref: "#/components/responses/WorkItemList"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [work-items]
      summary: 从首页、洞察或复核创建可追踪处理草稿
      operationId: postWorkItems
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XProjectId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/CreateWorkItem"
      responses:
        "201":
          $ref: "#/components/responses/WorkItemObject"
        default:
          $ref: "#/components/responses/Error"

  /work-items/{id}:
    get:
      tags: [work-items]
      summary: 可追踪处理草稿详情
      operationId: getWorkItemsById
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XProjectId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/WorkItemObject"
        default:
          $ref: "#/components/responses/Error"
    patch:
      tags: [work-items]
      summary: 更新可追踪处理草稿状态或负责人
      operationId: patchWorkItemsById
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XProjectId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Id"
      requestBody:
        $ref: "#/components/requestBodies/UpdateWorkItem"
      responses:
        "200":
          $ref: "#/components/responses/WorkItemObject"
        default:
          $ref: "#/components/responses/Error"

  /traces/{trace_id}:
    get:
      tags: [traces]
      summary: 按 trace_id 查询跨模块调用链和审计摘要
      description: >
        返回当前 tenant/project 范围内的公开领域追踪投影，仅包含业务对象引用、领域状态、
        重试摘要和可执行下一步；不返回适配器、调度、远端运行 ID、请求哈希、storage/tool
        payload 或其他执行内部证据。原始证据仅保存在 scoped DB、Outbox 与 Audit 记录中，
        并由离线 verifier 校验；本 API 不提供原始证据或内部排障入口。
      operationId: getTracesByTraceId
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XProjectId"
        - $ref: "#/components/parameters/XRequestId"
        - name: trace_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/TraceObject"
        default:
          $ref: "#/components/responses/Error"

  /tenants:
    get:
      tags: [tenants]
      summary: 租户列表
      operationId: getTenants
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Sort"
      responses:
        "200":
          description: 租户列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantListResponse"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [tenants]
      summary: 创建租户
      operationId: postTenants
      parameters:
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTenantRequest"
      responses:
        "201":
          description: 租户已创建
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantResponse"
        default:
          $ref: "#/components/responses/Error"

  /tenants/{id}:
    get:
      tags: [tenants]
      summary: 租户详情
      operationId: getTenantsById
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/GenericObject"
        default:
          $ref: "#/components/responses/Error"
    patch:
      tags: [tenants]
      summary: 修改租户状态、配额、授权或 ASR 绑定
      operationId: patchTenantsById
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Id"
      requestBody:
        $ref: "#/components/requestBodies/GenericRequest"
      responses:
        "200":
          $ref: "#/components/responses/GenericObject"
        default:
          $ref: "#/components/responses/Error"

  /projects:
    get:
      tags: [projects]
      summary: 项目列表
      operationId: getProjects
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Sort"
      responses:
        "200":
          description: 项目列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectListResponse"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [projects]
      summary: 创建项目
      operationId: postProjects
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: 项目已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        default:
          $ref: "#/components/responses/Error"

  /projects/{id}:
    get:
      tags: [projects]
      summary: 项目详情
      operationId: getProjectsById
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XProjectId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/GenericObject"
        default:
          $ref: "#/components/responses/Error"
    patch:
      tags: [projects]
      summary: 更新成员范围、质量目标和数据源绑定
      operationId: patchProjectsById
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XProjectId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Id"
      requestBody:
        $ref: "#/components/requestBodies/GenericRequest"
      responses:
        "200":
          $ref: "#/components/responses/GenericObject"
        default:
          $ref: "#/components/responses/Error"

  /scene-profiles:
    get:
      tags: [scene-profiles]
      summary: 场景配置列表
      operationId: getSceneProfiles
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XProjectId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/GenericList"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [scene-profiles]
      summary: 由实名人工创建场景配置草稿
      operationId: postSceneProfiles
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XProjectId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SceneProfileCreateRequest"
      responses:
        "201":
          $ref: "#/components/responses/GenericObject"
        default:
          $ref: "#/components/responses/Error"

  /scene-profiles/{scene_profile_id}:
    get:
      tags: [scene-profiles]
      summary: 场景配置及其不可变版本详情
      operationId: getSceneProfilesById
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XProjectId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/SceneProfileId"
      responses:
        "200":
          $ref: "#/components/responses/GenericObject"
        default:
          $ref: "#/components/responses/Error"

  /scene-profile-generation-runs:
    post:
      tags: [scene-profiles]
      summary: 让模型生成候选场景配置
      description: 模型输出只能物化为 candidate，不能直接发布或绑定项目。
      operationId: postSceneProfileGenerationRuns
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XProjectId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SceneProfileGenerationRequest"
      responses:
        "202":
          $ref: "#/components/responses/AcceptedRun"
        default:
          $ref: "#/components/responses/Error"

  /scene-profile-versions/{scene_profile_version_id}:
    patch:
      tags: [scene-profiles]
      summary: 修改未冻结的场景版本
      operationId: patchSceneProfileVersionsById
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XProjectId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/SceneProfileVersionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SceneProfilePatchRequest"
      responses:
        "200":
          $ref: "#/components/responses/GenericObject"
        default:
          $ref: "#/components/responses/Error"

  /scene-profile-versions/{scene_profile_version_id}/validations:
    post:
      tags: [scene-profiles]
      summary: 校验场景依赖闭包与版本 SHA
      operationId: postSceneProfileVersionsByIdValidations
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XProjectId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/SceneProfileVersionId"
      responses:
        "200":
          $ref: "#/components/responses/GenericObject"
        default:
          $ref: "#/components/responses/Error"

  /scene-profile-versions/{scene_profile_version_id}/reviews:
    post:
      tags: [scene-profiles]
      summary: 独立实名人工复核场景版本
      operationId: postSceneProfileVersionsByIdReviews
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XProjectId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/SceneProfileVersionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SceneProfileReviewRequest"
      responses:
        "200":
          $ref: "#/components/responses/GenericObject"
        default:
          $ref: "#/components/responses/Error"

  /scene-profile-versions/{scene_profile_version_id}/publish:
    post:
      tags: [scene-profiles]
      summary: 发布通过依赖校验与独立复核的场景版本
      operationId: postSceneProfileVersionsByIdPublish
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XProjectId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/SceneProfileVersionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SceneProfilePublishRequest"
      responses:
        "200":
          $ref: "#/components/responses/GenericObject"
        default:
          $ref: "#/components/responses/Error"

  /projects/{project_id}/scene-profile:
    get:
      tags: [scene-profiles]
      summary: 获取项目当前环境锁定的场景版本
      operationId: getProjectsByIdSceneProfile
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XProjectId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/ProjectId"
        - name: environment
          in: query
          schema:
            type: string
            enum: [development, staging, production]
            default: production
      responses:
        "200":
          $ref: "#/components/responses/GenericObject"
        default:
          $ref: "#/components/responses/Error"
    put:
      tags: [scene-profiles]
      summary: 以 CAS 方式绑定项目场景版本
