        relation: {type: string, enum: [split-recompute]}
        source_label_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
        target_label_ids:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
        requires_recompute: {type: boolean}
        allocation_weights:
          type: array
          nullable: true
          items: {type: integer}
        copy_existing_facts: {type: boolean, default: false}

    LabelMappingItemRequest:
      oneOf:
        - $ref: "#/components/schemas/LabelMappingIdentityItemRequest"
        - $ref: "#/components/schemas/LabelMappingRenameItemRequest"
        - $ref: "#/components/schemas/LabelMappingReplaceItemRequest"
        - $ref: "#/components/schemas/LabelMappingMergeItemRequest"
        - $ref: "#/components/schemas/LabelMappingRetireItemRequest"
        - $ref: "#/components/schemas/LabelMappingSplitRecomputeItemRequest"
      discriminator:
        propertyName: relation
        mapping:
          identity: "#/components/schemas/LabelMappingIdentityItemRequest"
          rename: "#/components/schemas/LabelMappingRenameItemRequest"
          replace: "#/components/schemas/LabelMappingReplaceItemRequest"
          merge: "#/components/schemas/LabelMappingMergeItemRequest"
          retire: "#/components/schemas/LabelMappingRetireItemRequest"
          split-recompute: "#/components/schemas/LabelMappingSplitRecomputeItemRequest"

    LabelMappingCreateRequest:
      type: object
      additionalProperties: false
      required:
        - mapping_version
        - source_label_version_id
        - target_label_version_id
        - expected_source_resource_version
        - expected_target_resource_version
        - items
      description: >
        客户端只提交映射意图与强版本 CAS；status、resource_version、compiler_version、content_sha256、
        canonical_manifest、approval/audit/outbox 及 tenant/project scope 均由服务端生成。
      properties:
        mapping_version: {type: string, minLength: 1, maxLength: 64}
        source_label_version_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
        target_label_version_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
        expected_source_resource_version: {type: integer, minimum: 1}
        expected_target_resource_version: {type: integer, minimum: 1}
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/LabelMappingItemRequest"

    LabelMappingValidationRequest:
      type: object
      additionalProperties: false
      required: [expected_resource_version]
      properties:
        expected_resource_version: {type: integer, minimum: 1}

    LabelMappingApprovalRequest:
      type: object
      additionalProperties: false
      required: [expected_resource_version, reason]
      description: 仅实名自然人 project_admin 可提交；客户端不得上传 approval_id、approved_by 或审批时间。
      properties:
        expected_resource_version: {type: integer, minimum: 1}
        reason: {type: string, minLength: 1, maxLength: 1000}

    LabelMappingBundlePublishRequest:
      type: object
      additionalProperties: false
      required:
        - mapping_version_ids
        - expected_mapping_resource_versions
        - source_label_version_ids
        - expected_source_resource_versions
        - target_label_version_id
        - expected_target_resource_version
      description: >
        mapping/source ID 必须各自唯一，expected-version 字典键必须与对应 ID 集合完全一致；target 不得同时
        是 source，所有引用必须是冻结 ID，禁止 latest/head/current。客户端不得上传 compiled closure 或 paths。
      properties:
        mapping_version_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 128}
        expected_mapping_resource_versions:
          type: object
          minProperties: 1
          additionalProperties: {type: integer, minimum: 1}
        source_label_version_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 128}
        expected_source_resource_versions:
          type: object
          minProperties: 1
          additionalProperties: {type: integer, minimum: 1}
        target_label_version_id: {type: string, minLength: 1, maxLength: 128}
        expected_target_resource_version: {type: integer, minimum: 1}

