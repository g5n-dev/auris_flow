    LabelRecomputePartition:
      type: object
      additionalProperties: false
      required: [partition_id, source_scope]
      properties:
        partition_id:
          type: string
          minLength: 2
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{1,127}$'
        source_scope:
          type: object
          minProperties: 1
          additionalProperties: true

    LabelRecomputeRunCreateRequest:
      type: object
      additionalProperties: false
      required:
        - target_label_version_id
        - source_environment
        - source_fact_namespace
        - source_head_generation
        - source_fact_set_id
        - source_manifest_sha256
        - fact_namespace
        - fact_as_of
        - partitions
        - asset_scope
        - coverage_policy
        - coverage_min
        - budget
        - budget_units
      description: >
        full recompute 强请求；目标、源 Head、cutoff、范围、覆盖与预算全部冻结。
        mapping_bundle_id/sha 必须同时为空或同时提供；candidate namespace 必须独立于源 namespace。
      properties:
        target_label_version_id:
          type: string
          minLength: 2
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{1,127}$'
        mapping_bundle_id:
          type: string
          nullable: true
          minLength: 2
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{1,127}$'
        mapping_bundle_sha256:
          type: string
          nullable: true
          pattern: '^[0-9a-f]{64}$'
        source_environment:
          type: string
          minLength: 2
          maxLength: 32
        source_fact_namespace:
          type: string
          minLength: 2
          maxLength: 128
        source_head_generation: {type: integer, minimum: 1}
        source_fact_set_id:
          type: string
          minLength: 2
          maxLength: 128
        source_manifest_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        fact_namespace:
          type: string
          minLength: 2
          maxLength: 128
        fact_as_of: {type: string, format: date-time}
        partitions:
          type: array
          minItems: 1
          maxItems: 1000
          items: {$ref: "#/components/schemas/LabelRecomputePartition"}
        asset_scope:
          type: object
          minProperties: 1
          additionalProperties: true
        coverage_policy:
          type: object
          minProperties: 1
          additionalProperties: true
        coverage_min: {type: number, minimum: 0, maximum: 1}
        budget:
          type: object
          minProperties: 1
          additionalProperties: true
        budget_units: {type: integer, minimum: 1}

    LabelRecomputeFactCandidate:
      type: object
      additionalProperties: false
      required:
        - aggregate_id
        - observation_ids
        - subject_scope
        - subject_key
        - event_or_segment_id
        - assertion_slot
        - occurred_at
        - label_id
        - value_type
        - value
      properties:
        aggregate_id: {type: string, minLength: 2, maxLength: 128}
        observation_ids:
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          items: {type: string}
        subject_scope: {type: string, minLength: 1, maxLength: 64}
        subject_key: {type: string, minLength: 1, maxLength: 256}
        event_or_segment_id: {type: string, minLength: 1, maxLength: 256}
        assertion_slot: {type: string, minLength: 1, maxLength: 128}
        occurred_at: {type: string, format: date-time}
        label_id: {type: string, minLength: 1, maxLength: 128}
        value_type:
          type: string
          enum: [boolean, categorical, multi, numeric, temporal, hierarchical]
        value: {}

    LabelRecomputeRunItemCompletionRequest:
      type: object
      additionalProperties: false
      required: [attempt_generation, completion_receipt_id, status]
      description: >
        客户端只提交回执引用和目标事实 lineage，不得提交 row_count 或任何 manifest SHA。
        服务端从持久化执行回执及实际 Observation/Aggregate/LabelFact 行重算全部锚点。
      properties:
        attempt_generation: {type: integer, minimum: 1}
        completion_receipt_id: {type: string, minLength: 2, maxLength: 128}
        status: {type: string, enum: [success, failed]}
        facts:
          type: array
          maxItems: 100000
          items: {$ref: "#/components/schemas/LabelRecomputeFactCandidate"}
          default: []
        error_code: {type: string, nullable: true, minLength: 1, maxLength: 128}
        retryable: {type: boolean, default: true}

    LabelRecomputeRunItemRetryRequest:
      type: object
      additionalProperties: false
      required: [expected_attempt_generation]
      properties:
        expected_attempt_generation: {type: integer, minimum: 1}

    LabelRecomputeMutationResponse:
      type: object
      additionalProperties: false
      required:
        - recompute_run_id
        - status
        - candidate_fact_set_id
        - candidate_manifest_sha256
        - fact_namespace
        - partition_count
        - completed_partition_count
        - failed_partition_count
        - row_count
        - audit_id
        - outbox_event_id
        - trace_id
      properties:
        recompute_run_id: {type: string}
        status:
          type: string
          enum: [requested, running, candidate-complete, partial-failed, failed, blocked]
        candidate_fact_set_id: {type: string}
        candidate_manifest_sha256:
          type: string
          nullable: true
          pattern: '^[0-9a-f]{64}$'
        fact_namespace: {type: string}
        partition_count: {type: integer, minimum: 1}
        completed_partition_count: {type: integer, minimum: 0}
        failed_partition_count: {type: integer, minimum: 0}
        row_count: {type: integer, minimum: 0}
        audit_id: {type: integer, minimum: 1}
        outbox_event_id: {type: integer, minimum: 1}
        trace_id: {type: string}

    LabelRecomputeRunItemMutationResponse:
      type: object
      additionalProperties: false
      required:
        - recompute_run_id
        - recompute_run_item_id
        - partition_id
        - status
        - attempt_generation
        - row_count
        - source_manifest_sha256
        - result_manifest_sha256
        - content_sha256
        - run_status
        - candidate_manifest_sha256
        - audit_id
        - outbox_event_id
        - trace_id
      properties:
        recompute_run_id: {type: string}
        recompute_run_item_id: {type: string}
        partition_id: {type: string}
        status: {type: string, enum: [queued, running, succeeded, failed]}
        attempt_generation: {type: integer, minimum: 1}
        row_count: {type: integer, minimum: 0}
        source_manifest_sha256: {type: string, nullable: true, pattern: '^[0-9a-f]{64}$'}
        result_manifest_sha256: {type: string, nullable: true, pattern: '^[0-9a-f]{64}$'}
        content_sha256: {type: string, nullable: true, pattern: '^[0-9a-f]{64}$'}
        run_status:
          type: string
          enum: [requested, running, candidate-complete, partial-failed, failed, blocked]
        candidate_manifest_sha256:
          type: string
          nullable: true
          pattern: '^[0-9a-f]{64}$'
        audit_id: {type: integer, minimum: 1}
        outbox_event_id: {type: integer, minimum: 1}
        trace_id: {type: string}

    LabelRecomputeMutationEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: {$ref: "#/components/schemas/LabelRecomputeMutationResponse"}
        meta: {$ref: "#/components/schemas/ApiMeta"}

    LabelRecomputeRunItemMutationEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: {$ref: "#/components/schemas/LabelRecomputeRunItemMutationResponse"}
        meta: {$ref: "#/components/schemas/ApiMeta"}

    LabelFactSetCreateRequest:
      type: object
      additionalProperties: false
      required:
        - fact_namespace
        - target_label_version_id
        - fact_as_of
        - partition_manifest
        - partition_manifest_sha256
        - source_manifest_sha256
        - result_manifest_sha256
        - row_count
      description: >
        冻结候选 FactSet 所需的完整客户端输入。partition_manifest 必须是严格 canonical JSON；
        partition_manifest_sha256 必须与其服务端重算值一致，客户端不得提交状态、审批、Head 或 Trace 字段。
      properties:
        fact_namespace:
          type: string
          minLength: 2
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
        target_label_version_id:
          type: string
          minLength: 2
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
        fact_as_of:
          type: string
          format: date-time
        partition_manifest:
          type: object
          minProperties: 1
          additionalProperties: true
        partition_manifest_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        source_manifest_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        result_manifest_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        row_count:
          type: integer
          minimum: 0

    LabelFactSetValidateRequest:
      type: object
      additionalProperties: false
      required: [expected_manifest_sha256]
      properties:
        expected_manifest_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'

    LabelFactSetApproveRequest:
      type: object
      additionalProperties: false
      required: [expected_manifest_sha256, approval_id, reason]
      properties:
        expected_manifest_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        approval_id:
          type: string
          minLength: 2
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
        reason:
          type: string
          minLength: 1
          maxLength: 1000

    LabelFactSetPublishPromoteRequest:
      type: object
      additionalProperties: false
      required: [environment, action, expected_generation]
      description: >
        bootstrap 只允许 expected_generation=0 且 current anchor 为空；promote 必须提供正 generation
        与完整 expected_current_fact_set_id/expected_current_manifest_sha256。服务端执行单 Head CAS。
      properties:
        environment:
          type: string
          minLength: 2
          maxLength: 32
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
        action:
          type: string
          enum: [bootstrap, promote]
        expected_generation:
          type: integer
          minimum: 0
        expected_current_fact_set_id:
          type: string
          nullable: true
          minLength: 2
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
        expected_current_manifest_sha256:
          type: string
          nullable: true
          pattern: '^[0-9a-f]{64}$'

    LabelFactSetRollbackRequest:
      type: object
      additionalProperties: false
      required:
        - environment
        - expected_generation
        - expected_current_fact_set_id
        - expected_current_manifest_sha256
      description: >
        回滚动作由服务端路径固定为 rollback；客户端必须冻结当前 Head generation、FactSet ID 与
        Manifest SHA。目标路径 ID 必须等于 Head ledger 冻结的 previous FactSet。
      properties:
        environment:
          type: string
          minLength: 2
          maxLength: 32
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
        action:
          type: string
          enum: [rollback]
          default: rollback
        expected_generation:
          type: integer
          minimum: 1
        expected_current_fact_set_id:
          type: string
          minLength: 2
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
        expected_current_manifest_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'

    LabelFactSetMutationResponse:
      type: object
      additionalProperties: false
      required:
        - fact_set_id
        - fact_namespace
        - target_label_version_id
        - status
        - manifest_sha256
        - row_count
        - audit_id
        - outbox_event_id
        - trace_id
      properties:
        fact_set_id: {type: string}
        fact_namespace: {type: string}
        target_label_version_id: {type: string}
        status:
          type: string
          enum: [candidate, validated, approved, published]
        manifest_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        row_count: {type: integer, minimum: 0}
        audit_id: {type: integer, minimum: 1}
        outbox_event_id: {type: integer, minimum: 1}
        trace_id: {type: string}

    LabelFactSetPromotionResponse:
      type: object
      additionalProperties: false
      required:
        - fact_set_head_id
        - head_event_id
        - environment
        - fact_namespace
        - action
        - generation
        - previous_generation
        - current_fact_set_id
        - current_manifest_sha256
        - previous_fact_set_id
        - previous_manifest_sha256
        - head_event_sha256
        - audit_id
        - outbox_event_id
        - trace_id
      properties:
        fact_set_head_id: {type: string}
        head_event_id: {type: string}
        environment: {type: string}
        fact_namespace: {type: string}
        action:
          type: string
          enum: [bootstrap, promote, rollback]
        generation: {type: integer, minimum: 1}
        previous_generation: {type: integer, nullable: true, minimum: 1}
        current_fact_set_id: {type: string}
        current_manifest_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        previous_fact_set_id: {type: string, nullable: true}
        previous_manifest_sha256:
          type: string
          nullable: true
          pattern: '^[0-9a-f]{64}$'
        head_event_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        audit_id: {type: integer, minimum: 1}
        outbox_event_id: {type: integer, minimum: 1}
        trace_id: {type: string}

    LabelFactSetMutationEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: {$ref: "#/components/schemas/LabelFactSetMutationResponse"}
        meta: {$ref: "#/components/schemas/ApiMeta"}

    LabelFactSetPromotionEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data: {$ref: "#/components/schemas/LabelFactSetPromotionResponse"}
        meta: {$ref: "#/components/schemas/ApiMeta"}

    LabelVersionItem:
      type: object
      additionalProperties: false
      required:
        - label_version_item_id
        - label_version_id
        - label_id
        - canonical_name
        - aliases
        - value_type
        - risk_level
        - mutual_exclusion_group
        - parent_ids
        - aggregation_rule
        - status
        - definition_sha256
        - trace_id
      properties:
        label_version_item_id: {type: string}
        label_version_id: {type: string}
        label_id: {type: string}
        canonical_name: {type: string}
        aliases:
          type: array
          items: {type: string}
        value_type:
          type: string
          enum: [boolean, categorical, multi, numeric, temporal, hierarchical]
        risk_level: {type: string}
        mutual_exclusion_group: {type: string, nullable: true}
        parent_ids:
          type: array
          items: {type: string}
        aggregation_rule: {type: object, additionalProperties: true}
        status:
          type: string
          enum: [active, retired, pending-configuration]
        definition_sha256:
          allOf:
            - $ref: "#/components/schemas/Sha256"
          nullable: true
        trace_id: {type: string}

    LabelVersionItemListResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/LabelVersionItem"
        meta:
          $ref: "#/components/schemas/ApiMeta"

    LabelVersionDeprecationPreflightRequest:
      type: object
      additionalProperties: false
      required: [expected_resource_version, reason]
      description: >
        replacement_label_version_id 与 mapping_bundle_id 必须同时提供或同时省略/null；
        客户端不得提交状态、阻断结果、审计 ID 或其他服务端字段。
      properties:
