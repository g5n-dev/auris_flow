        name: {type: string, minLength: 1, maxLength: 255}
        language: {type: string, minLength: 2, maxLength: 32}
        domain: {type: string, minLength: 1, maxLength: 128}
    CreateHotwordPackVersionRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version_id: {type: string, minLength: 3, maxLength: 128}
        version: {type: string, minLength: 1, maxLength: 64}
        baseline_version_id: {type: string, maxLength: 128, nullable: true}
        manifest_storage_object_id: {type: string, maxLength: 128, nullable: true}
    UpdateHotwordPackVersionRequest:
      type: object
      additionalProperties: false
      required: [expected_resource_version]
      properties:
        status:
          $ref: "#/components/schemas/HotwordPackVersionStatus"
        provider:
          type: string
          minLength: 1
          maxLength: 128
          description: >
            仅可与 status=validating 同时提交，作为本次异步 build 的目标 provider。
            服务端规范化并冻结构建输入；客户端不得借此写 compiled_provider 或 provider artifact，
            二者只能由受信构建完成回执固化。
        eval_run_id:
          type: string
          maxLength: 128
          nullable: true
          description: review_required → approved 时绑定已成功、锁定且通过门禁的 EvalRun。
        expected_resource_version: {type: integer, minimum: 1}
    HotwordItemCreateRequest:
      type: object
      additionalProperties: false
      required: [canonical_term, category, weight]
      properties:
        item_id: {type: string, minLength: 3, maxLength: 128}
        canonical_term: {type: string, minLength: 1, maxLength: 255}
        aliases:
          type: array
          maxItems: 32
          items: {type: string, minLength: 1, maxLength: 255}
        category: {type: string, minLength: 1, maxLength: 64}
        weight: {type: integer, minimum: 0, maximum: 100}
        source_badcase_id: {type: string, nullable: true}
        source_type:
          type: string
          enum: [manual, badcase, knowledge_candidate]
          default: manual
    HotwordItemPatchRequest:
      type: object
      additionalProperties: false
      required: [expected_resource_version]
      properties:
        canonical_term: {type: string, minLength: 1, maxLength: 255}
        aliases:
          type: array
          maxItems: 32
          items: {type: string, minLength: 1, maxLength: 255}
        category: {type: string, minLength: 1, maxLength: 64}
        weight: {type: integer, minimum: 0, maximum: 100}
        source_badcase_id: {type: string, nullable: true}
        source_type:
          type: string
          enum: [manual, badcase, knowledge_candidate]
        expected_resource_version: {type: integer, minimum: 1}
    CreateHotwordAnalysisRunRequest:
      type: object
      additionalProperties: false
      properties:
        date_from: {type: string, format: date}
        date_to: {type: string, format: date}
        store_id: {type: string}
        provider: {type: string, nullable: true}
        model_version: {type: string, nullable: true}
        hotword_pack_version_id: {type: string, nullable: true}
    CreateHotwordEvalRunRequest:
      type: object
      additionalProperties: false
      required: [eval_dataset_id, provider, expected_resource_version]
      properties:
        eval_dataset_id: {type: string}
        provider:
          type: string
          description: 必须与该版本异步构建后冻结的 compiled_provider 一致。
        expected_resource_version:
          type: integer
          minimum: 1
          description: 在创建 RunRecord 时冻结版本，防止评测期间词项或 manifest 漂移。
    HotwordEvalMetrics:
      type: object
      additionalProperties: false
      description: 仅允许受信评测 worker 在完成回执中提交；不得出现在 CreateHotwordEvalRunRequest。
      required: [error_rate, recall_rate, false_boost_rate, cer, wer, downstream_f1, p95_latency_ms, cost_per_minute]
      properties:
        trusted_occurrences: {type: integer, minimum: 0}
        unique_terms: {type: integer, minimum: 0}
        error_rate: {type: number, minimum: 0, maximum: 1}
        recall_rate: {type: number, minimum: 0, maximum: 1}
        false_boost_rate: {type: number, minimum: 0, maximum: 1}
        cer: {type: number, minimum: 0, maximum: 1}
        wer: {type: number, minimum: 0, maximum: 1}
        downstream_f1: {type: number, minimum: 0, maximum: 1}
        p95_latency_ms: {type: number, exclusiveMinimum: 0}
        cost_per_minute: {type: number, exclusiveMinimum: 0}
    PublishHotwordPackVersionRequest:
      type: object
      additionalProperties: false
      required: [eval_run_id, expected_resource_version, confirmation]
      properties:
        eval_run_id: {type: string}
        expected_resource_version: {type: integer, minimum: 1}
        confirmation: {type: string, enum: [publish]}
    RollbackHotwordPackVersionRequest:
      type: object
      additionalProperties: false
      required: [target_version_id, expected_resource_version, reason]
      properties:
        target_version_id: {type: string, minLength: 1, maxLength: 128}
        expected_resource_version: {type: integer, minimum: 1}
        reason: {type: string, minLength: 1, maxLength: 1000}
    EvalRunListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
        meta:
          $ref: "#/components/schemas/ApiMeta"
    GenericEvalRunRequest:
      type: object
      additionalProperties: true
      required: [dataset_id]
      properties:
        dataset_id: {type: string, minLength: 1, maxLength: 128}
        capability: {type: string, enum: [generic]}
        model_version: {type: string}
        label_version: {type: string}
        target: {type: object, additionalProperties: true}
        mode: {type: string, enum: [offline, shadow, regression]}
    LabelingEvalRunRequest:
      type: object
      additionalProperties: true
      required: [capability, label_version_id, prompt_version_id, model_version, aggregation_policy_version_id, optimization_run_id]
      anyOf:
        - required: [eval_dataset_version_id]
        - required: [dataset_id]
      properties:
        capability: {type: string, enum: [labeling]}
        dataset_id: {type: string, description: 兼容别名；缺省时服务端使用 eval_dataset_version_id。}
        eval_dataset_version_id: {type: string}
        label_version_id: {type: string}
        prompt_version_id: {type: string}
        model_version: {type: string}
        aggregation_policy_version_id: {type: string}
        optimization_run_id: {type: string}
        evaluation_suites:
          type: array
          minItems: 6
          maxItems: 6
          uniqueItems: true
          items: {type: string, enum: [golden, boundary, adversarial, fresh, canary, regression]}
          description: 提供时必须精确覆盖六类 suite；省略时服务端自动固化全部六类，不允许缺失、额外或重复。
        target: {type: object, additionalProperties: true}
        mode: {type: string, enum: [offline, shadow, regression]}
    CreateEvalRunRequest:
      oneOf:
        - $ref: "#/components/schemas/GenericEvalRunRequest"
        - $ref: "#/components/schemas/LabelingEvalRunRequest"
      discriminator:
        propertyName: capability
        mapping:
          generic: "#/components/schemas/GenericEvalRunRequest"
          labeling: "#/components/schemas/LabelingEvalRunRequest"
    DataAssetListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/DataAsset"
        meta:
          $ref: "#/components/schemas/ApiMeta"
    LineageResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [asset, nodes, edges, materializations]
          properties:
            asset:
              $ref: "#/components/schemas/DataAsset"
            nodes:
              type: array
              items:
                type: object
                additionalProperties: true
            edges:
              type: array
              items:
                type: object
                additionalProperties: true
            materializations:
              type: array
              items:
                $ref: "#/components/schemas/DataAssetMaterialization"
        meta:
          $ref: "#/components/schemas/ApiMeta"
    CreateBackfillRequest:
      type: object
      required: [partition_key, reason]
      properties:
        partition_key:
          type: string
        reason:
          type: string
        impact_scope:
          type: object
    SettingListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
        meta:
          $ref: "#/components/schemas/ApiMeta"
    UpdateSettingRequest:
      type: object
      required: [changes]
      properties:
        changes:
          type: object
        risk_ack:
          type: boolean
    CreateExternalCallbackRequest:
      type: object
      required: [target_object_type, target_object_id, payload_ref]
      properties:
        target_object_type:
          type: string
        target_object_id:
          type: string
        payload_ref:
          type: string
        endpoint_ref:
          type: string
