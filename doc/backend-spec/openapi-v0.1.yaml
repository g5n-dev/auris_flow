            schema:
              $ref: "#/components/schemas/CreateTaskRunRequest"
      responses:
        "202":
          description: 任务运行已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunActionResponse"
        default:
          $ref: "#/components/responses/Error"
    get:
      tags: [task-runs]
      summary: 任务运行列表
      description: >
        返回执行引擎中立的领域运行页。运行项位于 `data.items`，分页统计与游标位于
        `meta.total`、`meta.limit` 和 `meta.next_cursor`。
      operationId: getTaskRuns
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XProjectId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Status"
        - $ref: "#/components/parameters/Sort"
      responses:
        "200":
          description: 任务运行列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunListResponse"
        default:
          $ref: "#/components/responses/Error"

