        - $ref: "#/components/parameters/ItemId"
        - name: expected_resource_version
          in: query
          required: true
          schema: {type: integer, minimum: 1}
      responses:
        "200":
          description: 热词项已删除
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletedHotwordVersionItemResponse"
        default:
          $ref: "#/components/responses/Error"

  /hotword-analysis-runs:
    post:
      tags: [hotword-governance]
      summary: 创建热词统计与易错词分析运行
      description: >
        完成回执必须用 storage_objects descriptors 原子登记诊断、词级时间戳和 Badcase 证据，
        对象由服务端绑定当前 run/role/root_trace_id。worker 自报的 evidence_confidence 不是权威值；
        可信 ground_truth_source 必须引用同版本、同根 Trace 且当前仍 confirmed 的 source_badcase_ids。
        分析 worker 只能生成 discovery Badcase，人工 decisions 才能晋级可信等级。
      operationId: postHotwordAnalysisRuns
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XProjectId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHotwordAnalysisRunRequest"
      responses:
        "202":
          description: 分析运行已入队
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunActionResponse"
        default:
          $ref: "#/components/responses/Error"

  /hotword-pack-versions/{version_id}/eval-runs:
    post:
      tags: [hotword-governance, evaluation]
      summary: 为候选热词包版本创建锁定评测集的影子复测
      description: >
        返回 pending RunAction。服务端在入队时冻结 version_id、content_sha256、manifest、
        compiled_provider、provider 编译产物和评测集；请求体不得提交 baseline/candidate 指标。
        只有来自受信 worker 的完成回执通过冻结绑定校验后，才物化指标、门禁和 locked EvalRun。
      operationId: postHotwordPackVersionsByIdEvalRuns
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XProjectId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/VersionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHotwordEvalRunRequest"
      responses:
        "202":
          description: 影子评测已入队；data.status 固定为 pending，尚无 metrics/gate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunActionResponse"
        default:
          $ref: "#/components/responses/Error"

  /hotword-pack-versions/{version_id}/publish:
    post:
      tags: [hotword-governance]
      summary: 请求人工发布通过门禁的热词包版本
      description: >
        仅接受成功且锁定的 EvalRun、模型负责人审批、不同自然人的项目管理员确认和冻结的 provider 编译产物。
        接口只创建 pending 发布运行；受信完成回执再次校验冻结绑定后，才原子更新为 published、
        切换逻辑包当前版本并创建绑定该版本的 TaskVersion 草稿，不自动发布任务或切换生产。
      operationId: postHotwordPackVersionsByIdPublish
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XProjectId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/VersionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishHotwordPackVersionRequest"
      responses:
        "202":
          description: 发布运行已入队；data.status 固定为 pending，版本尚未 published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunActionResponse"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /hotword-pack-versions/{version_id}/rollback:
    post:
      tags: [hotword-governance]
      summary: 发起 ASR 热词包版本受控回滚
      description: >
        仅 model_engineer 可从逻辑包当前 published 版本发起，目标必须是同包历史 published 版本。
        请求冻结源版本、目标版本和逻辑包的 resource_version 与 root_trace_id；首次 worker
        处理固定进入 blocked，不同自然人的 project_admin 通过通用 Run decision 批准后才重新入队。
        成功只将源版本标记为 rolled_back 并切换逻辑包当前指针，不切 TaskVersion，不覆盖历史转写或物化。
      operationId: postHotwordPackVersionsByIdRollback
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XProjectId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/VersionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RollbackHotwordPackVersionRequest"
      responses:
        "202":
          description: 回滚运行已入队；data.status 固定为 pending，当前版本与资产尚未变更
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunActionResponse"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

