name: Release images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "SemVer release candidate (for example v1.0.0-rc.1)"
        required: true
        type: string

concurrency:
  group: release-images-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-context:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release_tag: ${{ steps.context.outputs.release_tag }}
      source_commit: ${{ steps.context.outputs.source_commit }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: context
        name: Validate immutable release context
        env:
          REQUESTED_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if [ "${GITHUB_REPOSITORY}" != "auris-flow/auris-flow" ]; then
            echo "release trust policy only permits auris-flow/auris-flow" >&2
            exit 2
          fi
          expected_ref="refs/tags/${REQUESTED_TAG}"
          if [ "${GITHUB_REF}" != "${expected_ref}" ]; then
            echo "release workflow must execute from the exact requested tag ref" >&2
            exit 2
          fi
          expected_workflow_ref="${GITHUB_REPOSITORY}/.github/workflows/release-images.yml@${expected_ref}"
          if [ "${GITHUB_WORKFLOW_REF}" != "${expected_workflow_ref}" ]; then
            echo "release workflow definition must come from the exact requested tag" >&2
            exit 2
          fi
          if ! RESOLVED_COMMIT="$(git rev-parse --verify "refs/tags/${REQUESTED_TAG}^{commit}")"; then
            echo "release tag does not exist in the fetched repository" >&2
            exit 2
          fi
          if [ "${RESOLVED_COMMIT}" != "${GITHUB_SHA}" ]; then
            echo "release workflow ref does not match the requested tag commit" >&2
            exit 2
          fi
          python3 - "${REQUESTED_TAG}" "${RESOLVED_COMMIT}" <<'PY'
          import os
          import re
          import sys

          tag, commit = sys.argv[1:]
          if re.fullmatch(r"v(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)(?:-rc\.[1-9]\d*)?", tag) is None:
              raise SystemExit("release tag must be SemVer or an rc.N prerelease")
          if re.fullmatch(r"[0-9a-f]{40}(?:[0-9a-f]{24})?", commit) is None:
              raise SystemExit("workflow must run from a complete Git object id")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"release_tag={tag}\nsource_commit={commit}\n")
          PY

  dependency-evidence:
    needs: release-context
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: prototype/auris-flow-ui/package-lock.json

      - uses: oras-project/setup-oras@8d34698a59f5ffe24821f0b48ab62a3de8b64b20 # v1.2.3
        with:
          version: "1.2.3"

      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
        with:
          cosign-release: "v2.5.3"

      - name: Synchronize all locked dependency environments
        run: |
          python -m pip install "uv==0.10.0"
          uv sync --locked --all-extras --project backend
          uv sync --locked --all-extras --project production/dagster
          npm ci --prefix prototype/auris-flow-ui

      - name: Install browser used by the release gate
        working-directory: prototype/auris-flow-ui
        run: npx playwright install chromium --with-deps

      - name: Verify the complete release candidate in a clean runner
        env:
          PYTHON: ${{ github.workspace }}/backend/.venv/bin/python
        run: bash scripts/verify_release.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: success()
        with:
          name: dependency-evidence-${{ needs.release-context.outputs.source_commit }}
          path: build/release-evidence/
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: dependency-evidence-failed-${{ needs.release-context.outputs.source_commit }}
          path: build/release-evidence/
          if-no-files-found: error
          retention-days: 14

  build-images:
    needs: [release-context, dependency-evidence]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: release
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_id: bff
            repository: auris-flow-bff
            dockerfile: production/backend/Dockerfile
          - image_id: dagster
            repository: auris-flow-dagster
            dockerfile: production/dagster/Dockerfile
          - image_id: edge
            repository: auris-flow-edge
            dockerfile: production/edge/Dockerfile
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Define lowercase immutable image reference
        env:
          RELEASE_TAG: ${{ needs.release-context.outputs.release_tag }}
          IMAGE_NAME: ${{ matrix.repository }}
        run: |
          registry_path="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}"
          echo "IMAGE_REPOSITORY=${registry_path}" >> "${GITHUB_ENV}"
          echo "IMAGE_TAGGED_REFERENCE=${registry_path}:${RELEASE_TAG}" >> "${GITHUB_ENV}"
          echo "IMAGE_BUILD_REFERENCE=${registry_path}:sha-${GITHUB_SHA}" >> "${GITHUB_ENV}"

      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        name: Build and push multi-architecture image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_BUILD_REFERENCE }}
          labels: |
            org.opencontainers.image.revision=${{ needs.release-context.outputs.source_commit }}
            org.opencontainers.image.version=${{ needs.release-context.outputs.release_tag }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          provenance: mode=max
          sbom: true

      - name: Generate downloadable CycloneDX image SBOM
        uses: anchore/sbom-action@f8bdd1d8ac5e901a77a92f111440fdb1b593736b # v0.20.6
        with:
          image: ${{ env.IMAGE_REPOSITORY }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: build/image-evidence/${{ matrix.image_id }}.cdx.json
          upload-artifact: false

      - name: Block HIGH and CRITICAL image vulnerabilities on amd64
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          image-ref: ${{ env.IMAGE_REPOSITORY }}@${{ steps.build.outputs.digest }}
          format: json
          output: build/image-evidence/${{ matrix.image_id }}.linux-amd64.trivy.json
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"

      - name: Block HIGH and CRITICAL image vulnerabilities on arm64
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ env.IMAGE_REPOSITORY }}@${{ steps.build.outputs.digest }}
          format: json
          output: build/image-evidence/${{ matrix.image_id }}.linux-arm64.trivy.json
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"

      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
        with:
          cosign-release: "v2.5.3"

      - name: Keyless sign and verify the exact manifest digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          WORKFLOW_IDENTITY: https://github.com/${{ github.workflow_ref }}
        run: |
          image="${IMAGE_REPOSITORY}@${IMAGE_DIGEST}"
          cosign sign --yes "${image}"
          cosign verify "${image}" \
            --certificate-identity "${WORKFLOW_IDENTITY}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

      - name: Record signed image provenance
        env:
          IMAGE_ID: ${{ matrix.image_id }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_TAG: ${{ needs.release-context.outputs.release_tag }}
          SOURCE_COMMIT: ${{ needs.release-context.outputs.source_commit }}
        run: |
          mkdir -p build/image-evidence
          jq -n \
            --arg image_id "${IMAGE_ID}" \
            --arg repository "${IMAGE_REPOSITORY}" \
            --arg tagged_reference "${IMAGE_TAGGED_REFERENCE}" \
            --arg image "${IMAGE_TAGGED_REFERENCE}@${IMAGE_DIGEST}" \
            --arg release_tag "${RELEASE_TAG}" \
            --arg source_commit "${SOURCE_COMMIT}" \
            '{image_id: $image_id, repository: $repository, tagged_reference: $tagged_reference, image: $image, release_tag: $release_tag, source_commit: $source_commit}' \
            > "build/image-evidence/${IMAGE_ID}.image.json"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: image-evidence-${{ matrix.image_id }}-${{ needs.release-context.outputs.source_commit }}
          path: build/image-evidence/
          if-no-files-found: error
          retention-days: 30

      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
        with:
          cosign-release: "v2.5.3"

  assemble-release:
    needs: [release-context, dependency-evidence, build-images]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: release
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dependency-evidence-${{ needs.release-context.outputs.source_commit }}
          path: build/release/dependencies

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: image-evidence-*-${{ needs.release-context.outputs.source_commit }}
          path: build/release/images
          merge-multiple: true

      - name: Resolve every Compose image to an immutable digest
        env:
          RELEASE_TAG: ${{ needs.release-context.outputs.release_tag }}
          SOURCE_COMMIT: ${{ needs.release-context.outputs.source_commit }}
          AURIS_PUBLIC_HOST: auris.example.com
          AURIS_EXTERNAL_CALLBACK_URL: https://platform.example.com/callbacks/auris-flow
          AURIS_EXTERNAL_CALLBACK_HOST: platform.example.com
        run: |
          export AURIS_BFF_IMAGE="$(jq -r '.image' build/release/images/bff.image.json)"
          export AURIS_DAGSTER_IMAGE="$(jq -r '.image' build/release/images/dagster.image.json)"
          export AURIS_EDGE_IMAGE="$(jq -r '.image' build/release/images/edge.image.json)"
          candidate_compose="${RUNNER_TEMP}/auris-candidate-compose.json"
          docker compose --env-file production/.env.example --file production/compose.yaml \
            config --no-path-resolution --format json --output "${candidate_compose}"

          lock_arguments=()
          while IFS=$'\t' read -r service image; do
            if [[ "${image}" == *@sha256:* ]]; then
              pinned="${image}"
            else
              manifest="$(docker buildx imagetools inspect "${image}" --format '{{json .Manifest}}')"
              digest="$(jq -er '.digest' <<<"${manifest}")"
              pinned="${image}@${digest}"
            fi
            lock_arguments+=(--image "${service}=${pinned}")
          done < <(jq -r '.services | to_entries[] | [.key, .value.image] | @tsv' "${candidate_compose}")

          python3 scripts/render_release_compose.py create-lock \
            --release-tag "${RELEASE_TAG}" \
            --source-commit "${SOURCE_COMMIT}" \
            "${lock_arguments[@]}" \
            --output build/release/images.lock.json
          python3 scripts/render_release_compose.py scan-plan \
            --image-lock build/release/images.lock.json \
            --output build/release/compose-image-scans/index.json

      - name: Install pinned Trivy scanner
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.70.0
          cache: true

      - name: Scan every unique final Compose digest on both architectures
        run: |
          scan_status=0
          while IFS=$'\t' read -r digest image; do
            report_id="${digest#sha256:}"
            for platform in linux/amd64 linux/arm64; do
              platform_id="${platform//\//-}"
              trivy image \
                --platform "${platform}" \
                --scanners vuln \
                --severity HIGH,CRITICAL \
                --ignore-unfixed=false \
                --ignorefile /dev/null \
                --exit-code 1 \
                --format json \
                --output "build/release/compose-image-scans/${report_id}.${platform_id}.trivy.json" \
                "${image}" \
                || scan_status=1
            done
          done < <(jq -r '.images[] | [.digest, .image] | @tsv' build/release/compose-image-scans/index.json)
          exit "${scan_status}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: compose-image-scans-${{ needs.release-context.outputs.source_commit }}
          path: build/release/compose-image-scans/
          if-no-files-found: error
          retention-days: 30

      - name: Promote only verified and signed digests to immutable release tags
        run: |
          for image_id in bff dagster edge; do
            record="build/release/images/${image_id}.image.json"
            repository="$(jq -er '.repository' "${record}")"
            tagged_reference="$(jq -er '.tagged_reference' "${record}")"
            digest="$(jq -er '.image | split("@") | .[1]' "${record}")"
            if existing_manifest="$(docker buildx imagetools inspect "${tagged_reference}" --format '{{json .Manifest}}' 2>/dev/null)"; then
              existing_digest="$(jq -er '.digest' <<<"${existing_manifest}")"
              if [[ "${existing_digest}" != "${digest}" ]]; then
                echo "refusing to retarget immutable release image ${tagged_reference}" >&2
                exit 1
              fi
            else
              docker buildx imagetools create \
                --tag "${tagged_reference}" \
                "${repository}@${digest}"
            fi
          done

      - name: Render and verify the production release bundle
        env:
          RELEASE_TAG: ${{ needs.release-context.outputs.release_tag }}
          SOURCE_COMMIT: ${{ needs.release-context.outputs.source_commit }}
          WORKFLOW_IDENTITY: https://github.com/${{ github.workflow_ref }}
        run: |
          python3 scripts/render_release_compose.py render \
            --image-lock build/release/images.lock.json \
            --output production/compose.release.json
          test ! -e build/release/deployment
          python3 scripts/release_bundle.py assemble \
            --repository-root . \
            --output build/release/deployment \
            --rendered-compose production/compose.release.json \
            --image-lock build/release/images.lock.json \
            --release-tag "${RELEASE_TAG}" \
            --source-commit "${SOURCE_COMMIT}"
          cosign sign-blob --yes \
            --bundle "build/release/auris-flow-${RELEASE_TAG}-release-metadata.sigstore.json" \
            build/release/deployment/production/release-metadata.json
          cosign verify-blob \
            --bundle "build/release/auris-flow-${RELEASE_TAG}-release-metadata.sigstore.json" \
            --certificate-identity "${WORKFLOW_IDENTITY}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            build/release/deployment/production/release-metadata.json
          python3 scripts/release_bundle.py verify \
            --bundle-root build/release/deployment \
            --verify-signature \
            --signature-bundle "build/release/auris-flow-${RELEASE_TAG}-release-metadata.sigstore.json" \
            --certificate-identity "${WORKFLOW_IDENTITY}"
          python3 scripts/verify_production_compose.py --release \
            --compose-file build/release/deployment/production/compose.yaml \
            --env-file build/release/deployment/production/.env.example

      - name: Create deterministic source, deployment, and evidence archives
        env:
          RELEASE_TAG: ${{ needs.release-context.outputs.release_tag }}
          SOURCE_COMMIT: ${{ needs.release-context.outputs.source_commit }}
        run: |
          source_archive="build/release/auris-flow-${RELEASE_TAG}-source.tar.gz"
          git archive --format=tar --prefix="auris-flow-${RELEASE_TAG}-source/" "${SOURCE_COMMIT}" \
            | gzip -n --best > "${source_archive}"
          test -s "${source_archive}"

          source_epoch="$(git show -s --format=%ct "${SOURCE_COMMIT}")"
          deployment_staging="${RUNNER_TEMP}/auris-flow-${RELEASE_TAG}-deployment.tar.gz"
          evidence_staging="${RUNNER_TEMP}/auris-flow-${RELEASE_TAG}-evidence.tar.gz"
          tar \
            --sort=name \
            --mtime="@${source_epoch}" \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            --transform="s,^deployment,auris-flow-${RELEASE_TAG}-deployment," \
            --create \
            --file=- \
            --directory=build/release \
            deployment \
            | gzip -n --best > "${deployment_staging}"
          mv -- "${deployment_staging}" \
            "build/release/auris-flow-${RELEASE_TAG}-deployment.tar.gz"

          tar \
            --sort=name \
            --mtime="@${source_epoch}" \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            --transform="s,^,auris-flow-${RELEASE_TAG}-evidence/," \
            --create \
            --file=- \
            --directory=build/release \
            dependencies images compose-image-scans images.lock.json \
            | gzip -n --best > "${evidence_staging}"
          mv -- "${evidence_staging}" \
            "build/release/auris-flow-${RELEASE_TAG}-evidence.tar.gz"

      - name: Produce commit-bound checksums and release manifest
        run: |
          python3 scripts/render_release_compose.py manifest \
            --base-dir build/release \
            --image-lock build/release/images.lock.json \
            --output build/release/release-manifest.json \
            --checksums-output build/release/SHA256SUMS \
            --artifact "build/release/auris-flow-${{ needs.release-context.outputs.release_tag }}-source.tar.gz" \
            --artifact "build/release/auris-flow-${{ needs.release-context.outputs.release_tag }}-deployment.tar.gz" \
            --artifact "build/release/auris-flow-${{ needs.release-context.outputs.release_tag }}-evidence.tar.gz" \
            --artifact "build/release/auris-flow-${{ needs.release-context.outputs.release_tag }}-release-metadata.sigstore.json"

      - name: Keyless sign and verify the release checksum set
        env:
          WORKFLOW_IDENTITY: https://github.com/${{ github.workflow_ref }}
        run: |
          cosign sign-blob --yes --bundle build/release/SHA256SUMS.sigstore.json \
            build/release/SHA256SUMS
          cosign verify-blob \
            --bundle build/release/SHA256SUMS.sigstore.json \
            --certificate-identity "${WORKFLOW_IDENTITY}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            build/release/SHA256SUMS

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: auris-flow-${{ needs.release-context.outputs.release_tag }}-${{ needs.release-context.outputs.source_commit }}
          path: build/release/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

  publish-release:
    needs: [release-context, assemble-release]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release-publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: auris-flow-${{ needs.release-context.outputs.release_tag }}-${{ needs.release-context.outputs.source_commit }}
          path: build/release

      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
        with:
          cosign-release: "v2.5.3"

      - name: Reverify downloaded release evidence before publication
        env:
          WORKFLOW_IDENTITY: https://github.com/${{ github.workflow_ref }}
        run: |
          cosign verify-blob \
            --bundle build/release/SHA256SUMS.sigstore.json \
            --certificate-identity "${WORKFLOW_IDENTITY}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            build/release/SHA256SUMS
          (cd build/release && sha256sum --check SHA256SUMS)

      - name: Publish immutable assets to the approved GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-context.outputs.release_tag }}
          SOURCE_COMMIT: ${{ needs.release-context.outputs.source_commit }}
        run: |
          TAG_COMMIT="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          if [ "${TAG_COMMIT}" != "${SOURCE_COMMIT}" ]; then
            echo "release tag moved after the build was approved" >&2
            exit 2
          fi
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "refusing to replace an existing GitHub Release" >&2
            exit 2
          fi

          assets=(
            "build/release/auris-flow-${RELEASE_TAG}-deployment.tar.gz"
            "build/release/auris-flow-${RELEASE_TAG}-source.tar.gz"
            "build/release/auris-flow-${RELEASE_TAG}-evidence.tar.gz"
            "build/release/auris-flow-${RELEASE_TAG}-release-metadata.sigstore.json"
            "build/release/release-manifest.json"
            "build/release/SHA256SUMS"
            "build/release/SHA256SUMS.sigstore.json"
          )
          for asset in "${assets[@]}"; do
            if [ ! -f "${asset}" ] || [ -L "${asset}" ] || [ ! -s "${asset}" ]; then
              echo "required release asset is missing or unsafe: ${asset}" >&2
              exit 2
            fi
          done

          release_flags=(
            --verify-tag
            --title "Auris Flow ${RELEASE_TAG}"
            --notes-file build/release/deployment/CHANGELOG.md
          )
          if [[ "${RELEASE_TAG}" == *-rc.* ]]; then
            release_flags+=(--prerelease)
          else
            release_flags+=(--latest)
          fi
          gh release create "${RELEASE_TAG}" \
            "${release_flags[@]}" \
            "${assets[@]}"
