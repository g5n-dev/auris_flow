name: CodeQL

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "24 2 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - python
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          languages: ${{ matrix.language }}
      - name: Perform CodeQL analysis
        id: analyze
        uses: github/codeql-action/analyze@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          category: "/language:${{ matrix.language }}"
          output: codeql-results
      - name: Enforce High/Critical policy on this analysis
        run: python scripts/check_codeql_policy.py codeql-results
      - name: Upload CodeQL diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codeql-${{ matrix.language }}-${{ github.sha }}
          path: codeql-results/
          if-no-files-found: error
          retention-days: 14

  policy:
    name: CodeQL Policy
    if: always()
    needs: analyze
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every language analysis
        env:
          ANALYZE_RESULT: ${{ needs.analyze.result }}
        run: |
          if [ "${ANALYZE_RESULT}" != "success" ]; then
            echo "At least one CodeQL language analysis failed or was cancelled." >&2
            exit 1
          fi
