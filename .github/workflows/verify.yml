name: Verify

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - "release/**"
    tags:
      - "v*"
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_check:
        description: Run the complete fail-closed release gate
        required: false
        default: false
        type: boolean

jobs:
  clean-clone-reproducibility:
    name: Clean clone reproducibility
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install pinned uv
        run: python -m pip install "uv==0.10.0"

      - name: Restore clean-clone download caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/auris-flow-clean-clone-cache
          key: clean-clone-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('backend/uv.lock', 'production/dagster/uv.lock', 'prototype/auris-flow-ui/package-lock.json') }}
          restore-keys: |
            clean-clone-${{ runner.os }}-${{ runner.arch }}-

      - name: Test the clean-clone gate harness
        run: python scripts/tests/test_verify_clean_clone.py

      - name: Rebuild and verify the committed tree from a clean clone
        env:
          AURIS_CLEAN_CLONE_CACHE_DIR: ${{ runner.temp }}/auris-flow-clean-clone-cache
        run: bash scripts/verify_clean_clone.sh

  verify:
    needs: clean-clone-reproducibility
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      AURIS_RELEASE_CHECK: "0"
      AURIS_RUN_E2E: "0"

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: prototype/auris-flow-ui/package-lock.json

      - name: Install locked development dependencies
        run: |
          python -m pip install "uv==0.10.0"
          uv sync --locked --all-extras --project backend
          npm ci --ignore-scripts --prefix prototype/auris-flow-ui

      - name: Verify the mergeable development baseline
        env:
          PYTHON: ${{ github.workspace }}/backend/.venv/bin/python
        run: bash scripts/verify_fast.sh

  release-verify:
    if: >-
      github.event_name == 'release' ||
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.release_check)
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      packages: read
    env:
      AURIS_RELEASE_CHECK: "1"
      AURIS_RUN_E2E: "1"
      AURIS_VISUAL_RUNTIME: "container"

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: prototype/auris-flow-ui/package-lock.json

      # oras-project/setup-oras v1.2.3
      - uses: oras-project/setup-oras@8d34698a59f5ffe24821f0b48ab62a3de8b64b20
        with:
          version: "1.2.3"

      # docker/login-action v3.4.0
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # sigstore/cosign-installer v3.9.2
      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159
        with:
          cosign-release: "v2.5.3"

      - name: Install locked Python dependencies
        run: |
          python -m pip install "uv==0.10.0"
          uv sync --locked --all-extras --project backend
          uv sync --locked --all-extras --project production/dagster

      - name: Install frontend dependencies
        run: npm ci --prefix prototype/auris-flow-ui

      - name: Install Playwright browser
        working-directory: prototype/auris-flow-ui
        run: npx playwright install chromium --with-deps

      - name: Verify strict pre-image release gates
        env:
          PYTHON: ${{ github.workspace }}/backend/.venv/bin/python
        run: bash scripts/verify_release.sh --pre-image

      - name: Upload release supply-chain evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: auris-flow-release-evidence-${{ github.sha }}
          path: build/release-evidence/
          if-no-files-found: error
          retention-days: 30
