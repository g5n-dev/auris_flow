name: Verify

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - "release/**"
    tags:
      - "v*"
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      AURIS_RELEASE_CHECK: "1"
      AURIS_RUN_E2E: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: prototype/auris-flow-ui/package-lock.json

      - name: Install locked Python dependencies
        run: |
          python -m pip install "uv==0.10.0"
          uv sync --locked --all-extras --project backend
          uv sync --locked --all-extras --project production/dagster

      - name: Install frontend dependencies
        run: npm ci --prefix prototype/auris-flow-ui

      - name: Install Playwright browser
        working-directory: prototype/auris-flow-ui
        run: npx playwright install chromium --with-deps

      - name: Verify strict release gate
        env:
          PYTHON: ${{ github.workspace }}/backend/.venv/bin/python
        run: bash scripts/verify_release.sh

      - name: Upload release supply-chain evidence
        uses: actions/upload-artifact@v4
        with:
          name: auris-flow-release-evidence-${{ github.sha }}
          path: build/release-evidence/
          if-no-files-found: error
          retention-days: 30
