version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"

  - package-ecosystem: "npm"
    directory: "/prototype/auris-flow-ui"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 10
    groups:
      react-runtime:
        patterns:
          - "react"
          - "react-dom"
      vite-toolchain:
        patterns:
          - "vite"
          - "@vitejs/*"
      playwright-tooling:
        patterns:
          - "playwright"
          - "@playwright/*"
      type-definitions:
        patterns:
          - "@types/*"
    ignore:
      - dependency-name: "react"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "react-dom"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "lucide-react"
        update-types:
          - "version-update:semver-major"
    labels:
      - "dependencies"
      - "frontend"

  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 10
    groups:
      backend-api-runtime:
        patterns:
          - "fastapi"
          - "uvicorn*"
      backend-database-runtime:
        patterns:
          - "sqlalchemy"
          - "alembic"
      backend-pydantic-runtime:
        patterns:
          - "pydantic*"
      backend-pytest:
        patterns:
          - "pytest*"
      backend-ruff:
        patterns:
          - "ruff"
      backend-mypy:
        patterns:
          - "mypy"
      backend-audit:
        patterns:
          - "pip-audit"
    labels:
      - "dependencies"
      - "backend"

  - package-ecosystem: "uv"
    directory: "/production/dagster"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:30"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 10
    groups:
      dagster-family:
        patterns:
          - "dagster*"
      dagster-click:
        patterns:
          - "click"
      dagster-database-driver:
        patterns:
          - "pymysql"
      dagster-pytest:
        patterns:
          - "pytest"
      dagster-ruff:
        patterns:
          - "ruff"
      dagster-mypy:
        patterns:
          - "mypy"
    labels:
      - "dependencies"
      - "dagster"
