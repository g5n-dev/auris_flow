name: Bug report
description: Report a reproducible Auris Flow defect.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include secrets, customer data, raw audio, transcripts, private URLs, or credentials.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What failed, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction Steps
      description: Include commands, UI actions, and relevant trace_id values.
      placeholder: |
        1. Run ...
        2. Click ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python, Node, Docker, browser, and whether this used fast or real-stack verification.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs Or Output
      render: shell
